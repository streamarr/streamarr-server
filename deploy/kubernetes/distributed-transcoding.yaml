apiVersion: v1
kind: Namespace
metadata:
  name: streamarr
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamarr-server
  namespace: streamarr
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamarr-transcode-worker
  namespace: streamarr
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: streamarr-worker-sessions
  namespace: streamarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: streamarr-server
  portLevelMtls:
    "9090":
      mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: streamarr-worker-sessions
  namespace: streamarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: streamarr-server
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/streamarr/sa/streamarr-transcode-worker
      to:
        - operation:
            ports:
              - "9090"
---
apiVersion: v1
kind: Service
metadata:
  name: streamarr-server
  namespace: streamarr
spec:
  selector:
    app.kubernetes.io/name: streamarr-server
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: worker-grpc
      appProtocol: grpc
      port: 9090
      targetPort: worker-grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamarr-server
  namespace: streamarr
  labels:
    app.kubernetes.io/name: streamarr-server
    app.kubernetes.io/component: control-plane
spec:
  replicas: 1
  # The in-memory session and worker registries require exactly one server; a rolling update
  # would briefly run two servers behind the same Service and split-brain both registries.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: streamarr-server
  template:
    metadata:
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
      labels:
        app.kubernetes.io/name: streamarr-server
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: streamarr-server
      containers:
        - name: server
          # Replace with the release you are deploying; :latest breaks rollback.
          image: streamarr/streamarr-server:vX.Y.Z
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          ports:
            - name: http
              containerPort: 8080
            - name: worker-grpc
              containerPort: 9090
          # Spring Boot exposes these probe groups automatically on Kubernetes. Do not add the
          # transcodeExecutor health indicator to either group: readiness failure would unroute
          # the worker-grpc port on this shared Service, so a zero-worker server could never
          # become ready again.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: streamarr-runtime
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: streamarr-runtime
                  key: datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: streamarr-runtime
                  key: datasource-password
            - name: STREAMING_WORKER_SESSION_ADDRESS
              value: 0.0.0.0
            - name: STREAMING_WORKER_SESSION_PORT
              value: "9090"
            - name: STREAMING_REMOTE_SOURCE_NAMESPACE_ID
              value: cccccccc-cccc-cccc-cccc-cccccccccccc
            - name: STREAMING_REMOTE_SOURCE_ROOT
              value: /media
          volumeMounts:
            - name: media
              mountPath: /media
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: streamarr-media
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamarr-transcode-worker
  namespace: streamarr
  labels:
    app.kubernetes.io/name: streamarr-transcode-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: streamarr-transcode-worker
  template:
    metadata:
      annotations:
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
      labels:
        app.kubernetes.io/name: streamarr-transcode-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: streamarr-transcode-worker
      containers:
        - name: worker
          # Replace with the release you are deploying; :latest breaks rollback.
          image: streamarr/streamarr-transcode-worker:vX.Y.Z
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 1Gi
          ports:
            - name: http-health
              containerPort: 9091
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-health
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http-health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http-health
            periodSeconds: 5
          env:
            - name: SERVER_PORT
              value: "9091"
            - name: TRANSCODE_WORKER_CONTROL_PLANE_HOST
              value: streamarr-server
            - name: TRANSCODE_WORKER_CONTROL_PLANE_PORT
              value: "9090"
            - name: TRANSCODE_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: TRANSCODE_WORKER_SOURCE_NAMESPACE_ID
              value: cccccccc-cccc-cccc-cccc-cccccccccccc
            - name: TRANSCODE_WORKER_SOURCE_ROOT
              value: /media
            - name: TRANSCODE_WORKER_SLOTS
              value: "1"
          volumeMounts:
            - name: media
              mountPath: /media
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: streamarr-media
