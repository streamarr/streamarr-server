services:

  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  streamarr-server:
    image: streamarr/streamarr-server:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_PROPERTIES_HIBERNATE_SHOW_SQL: false
      LANG: C.UTF-8
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      STREAMING_WORKER_SESSION_LOOPBACK_ENABLED: "true"
      STREAMING_WORKER_SESSION_LOOPBACK_PORT: ${STREAMARR_WORKER_SESSION_PORT:-9090}
      STREAMING_REMOTE_SOURCE_NAMESPACE_ID: ${STREAMARR_SOURCE_NAMESPACE_ID:-cccccccc-cccc-cccc-cccc-cccccccccccc}
      STREAMING_REMOTE_SOURCE_ROOT: /media
    volumes:
      - ${STREAMARR_MEDIA_PATH:-/mpool/media/clean/movies}:/media:ro

  transcode-worker:
    image: streamarr/streamarr-server:latest
    entrypoint: worker
    restart: unless-stopped
    network_mode: service:streamarr-server
    depends_on:
      - streamarr-server
    environment:
      TRANSCODE_WORKER_PLAINTEXT: "true"
      TRANSCODE_WORKER_CONTROL_PLANE_HOST: 127.0.0.1
      TRANSCODE_WORKER_CONTROL_PLANE_PORT: ${STREAMARR_WORKER_SESSION_PORT:-9090}
      TRANSCODE_WORKER_ID: ${STREAMARR_WORKER_ID:-aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa}
      TRANSCODE_WORKER_SOURCE_NAMESPACE_ID: ${STREAMARR_SOURCE_NAMESPACE_ID:-cccccccc-cccc-cccc-cccc-cccccccccccc}
      TRANSCODE_WORKER_SOURCE_ROOT: /media
      TRANSCODE_WORKER_SLOTS: ${STREAMARR_WORKER_SLOTS:-1}
    volumes:
      - ${STREAMARR_MEDIA_PATH:-/mpool/media/clean/movies}:/media:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
    profiles:
      - observability
