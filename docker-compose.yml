services:

  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  streamarr-server:
    image: streamarr/streamarr-server:latest
    restart: always
    # Outlasts the 30 s shutdown drain of library operations.
    stop_grace_period: 45s
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_PROPERTIES_HIBERNATE_SHOW_SQL: false
      LANG: C.UTF-8
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      STREAMING_WORKER_SESSION_PORT: ${STREAMARR_WORKER_SESSION_PORT:-9090}
      STREAMING_REMOTE_SOURCE_NAMESPACE_ID: ${STREAMARR_SOURCE_NAMESPACE_ID:-cccccccc-cccc-cccc-cccc-cccccccccccc}
      STREAMING_REMOTE_SOURCE_ROOT: /media
      # Exports the Micrometer meters to Prometheus. Every other OpenTelemetry instrumentation stays
      # off, so the server's database and request paths are unchanged, and no spans or log records
      # are produced. The starter cannot bind OTEL_METRICS_EXPORTER or OTEL_LOGS_EXPORTER from the
      # environment, and the server fails to start with either of them.
      OTEL_SDK_DISABLED: "false"
      OTEL_SERVICE_NAME: streamarr-server
      OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED: "false"
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
      OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    volumes:
      - ${STREAMARR_MEDIA_PATH:-/mpool/media/clean/movies}:/media:ro
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${STREAMARR_METRICS_RETENTION:-15d}
      - --web.enable-otlp-receiver
    # The UI and query API have no authentication, so they listen on the host's loopback only.
    ports:
      - "127.0.0.1:${STREAMARR_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus

  transcode-worker:
    image: ${STREAMARR_WORKER_IMAGE:?Set STREAMARR_WORKER_IMAGE to the verified standalone worker image}
    restart: unless-stopped
    network_mode: service:streamarr-server
    depends_on:
      - streamarr-server
    environment:
      TRANSCODE_WORKER_CONTROL_PLANE_HOST: 127.0.0.1
      TRANSCODE_WORKER_CONTROL_PLANE_PORT: ${STREAMARR_WORKER_SESSION_PORT:-9090}
      TRANSCODE_WORKER_ID: ${STREAMARR_WORKER_ID:-aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa}
      TRANSCODE_WORKER_SOURCE_NAMESPACE_ID: ${STREAMARR_SOURCE_NAMESPACE_ID:-cccccccc-cccc-cccc-cccc-cccccccccccc}
      TRANSCODE_WORKER_SOURCE_ROOT: /media
      TRANSCODE_WORKER_SLOTS: ${STREAMARR_WORKER_SLOTS:-1}
      # Empty adapts the background probe capacity to the host. A positive number fixes it.
      TRANSCODE_WORKER_PROBE_CAPACITY: ${STREAMARR_WORKER_PROBE_CAPACITY:-}
      LANG: C.UTF-8
    volumes:
      - ${STREAMARR_MEDIA_PATH:-/mpool/media/clean/movies}:/media:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      GRAFANA_CLOUD_INSTANCE_ID: ${GRAFANA_CLOUD_INSTANCE_ID:-}
      GRAFANA_CLOUD_API_KEY: ${GRAFANA_CLOUD_API_KEY:-}
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
    profiles:
      - observability

volumes:
  prometheus-data:
