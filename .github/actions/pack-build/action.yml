name: Pack Build
description: Build and verify a local container image using Cloud Native Buildpacks

inputs:
  image-version:
    description: Version recorded in the OCI image metadata
    required: true
outputs:
  image:
    description: Verified image in the local Docker daemon
    value: ${{ steps.build.outputs.image }}

runs:
  using: composite
  steps:
    - name: Install pack CLI
      uses: buildpacks/github-actions/setup-pack@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5

    - name: Build with pack CLI
      id: build
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_IMAGE_VERSION: ${{ inputs.image-version }}
      run: |
        build_arch="$(uname -m)"
        build_image="index.docker.io/streamarr/streamarr-server:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${build_arch}"
        image_revision="$(git rev-parse HEAD)"
        pack_args=(
          --builder paketobuildpacks/ubuntu-noble-builder:0.0.190
          --buildpack paketo-buildpacks/java
          --buildpack paketo-buildpacks/procfile@5.14.0
          --env BP_JVM_VERSION=25
          --env BP_INCLUDE_FILES=Procfile
          --env "BP_OCI_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --env "BP_OCI_REVISION=${image_revision}"
          --env "BP_OCI_VERSION=${INPUT_IMAGE_VERSION}"
          --path .
        )

        # Pin independently resolved Pack inputs. Procfile must be versioned because the builder
        # includes several versions, making an unversioned reference ambiguous.
        pack build "${build_image}" "${pack_args[@]}"

        "${ACTION_PATH}/verify-server-image.sh" \
          "${build_image}" \
          "${INPUT_IMAGE_VERSION}" \
          "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          "${image_revision}"

        "${ACTION_PATH}/verify-cedar-image.sh" "${build_image}"
        echo "image=${build_image}" >> "${GITHUB_OUTPUT}"
