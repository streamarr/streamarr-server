name: Pack Build
description: Build and publish a container image using Cloud Native Buildpacks

inputs:
  tags:
    description: Space-separated list of image tags (e.g. "streamarr/streamarr-server:latest streamarr/streamarr-server:v1.2.3")
    required: true
  publish:
    description: Whether to publish the image to the registry
    required: true
  dockerhub-username:
    description: Docker Hub username
    required: true
  dockerhub-token:
    description: Docker Hub token
    required: true

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Install pack CLI
      uses: buildpacks/github-actions/setup-pack@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5

    - name: Install pinned FFmpeg runtime
      shell: bash
      run: .github/actions/pack-build/install-ffmpeg.sh .ffmpeg

    - name: Build with pack CLI
      shell: bash
      env:
        INPUT_TAGS: ${{ inputs.tags }}
      run: |
        tag_args=""
        for tag in ${INPUT_TAGS}; do
          tag_args="${tag_args} --tag ${tag}"
        done

        build_image="index.docker.io/streamarr/streamarr-server:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        # Pin independently resolved Pack inputs. Procfile must be versioned because jammy-full
        # includes several versions, making an unversioned reference ambiguous.
        pack build "${build_image}" \
            ${tag_args} \
            --builder paketobuildpacks/builder-jammy-full:0.3.639 \
            --buildpack paketo-buildpacks/java \
            --buildpack paketo-buildpacks/procfile@5.13.6 \
            --env BP_JVM_VERSION=25 \
            --env BP_INCLUDE_FILES=.profile:Procfile:.ffmpeg/bin/*:.ffmpeg/LICENSE.txt:.ffmpeg/SOURCE.txt \
            --path . \
            --cache-image index.docker.io/streamarr/spring-boot-buildpack-paketo-cache-image:latest

        .github/actions/pack-build/verify-ffmpeg-image.sh "${build_image}"

    - name: Publish verified image tags
      if: inputs.publish == 'true'
      shell: bash
      env:
        INPUT_TAGS: ${{ inputs.tags }}
      run: |
        for tag in ${INPUT_TAGS}; do
          docker push "${tag}"
        done
