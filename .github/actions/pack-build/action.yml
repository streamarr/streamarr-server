name: Pack Build
description: Build and publish a container image using Cloud Native Buildpacks

inputs:
  tags:
    description: Space-separated list of image tags (e.g. "streamarr/streamarr-server:latest streamarr/streamarr-server:v1.2.3")
    required: true
  publish:
    description: Whether to publish the image to the registry
    required: true
  image-version:
    description: Version recorded in the OCI image metadata
    required: true
  dockerhub-username:
    description: Docker Hub username
    required: false
  dockerhub-token:
    description: Docker Hub token
    required: false

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      if: inputs.publish == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Install pack CLI
      uses: buildpacks/github-actions/setup-pack@e3b14c6e906f91da358e01dc2849ce068188107f # v5.12.5

    - name: Build with pack CLI
      shell: bash
      env:
        INPUT_PUBLISH: ${{ inputs.publish }}
        INPUT_IMAGE_VERSION: ${{ inputs.image-version }}
      run: |
        build_arch="$(uname -m)"
        build_image="index.docker.io/streamarr/streamarr-server:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${build_arch}"
        pack_args=(
          --builder paketobuildpacks/ubuntu-noble-builder:0.0.164
          --buildpack paketo-buildpacks/java
          --buildpack paketo-buildpacks/procfile@5.13.6
          --buildpack ./buildpacks/ffmpeg
          --env BP_JVM_VERSION=25
          --env BP_INCLUDE_FILES=Procfile
          --env "BP_OCI_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --env "BP_OCI_REVISION=${GITHUB_SHA}"
          --env "BP_OCI_VERSION=${INPUT_IMAGE_VERSION}"
          --path .
        )

        # Pin independently resolved Pack inputs. Procfile must be versioned because the builder
        # includes several versions, making an unversioned reference ambiguous.
        if [[ "${INPUT_PUBLISH}" == "true" ]]; then
          pack build "${build_image}" "${pack_args[@]}" \
              --publish \
              --cache-image "index.docker.io/streamarr/spring-boot-buildpack-paketo-cache-image:latest-${build_arch}"
        else
          pack build "${build_image}" "${pack_args[@]}"
        fi

        .github/actions/pack-build/verify-ffmpeg-image.sh \
          "${build_image}" \
          "${INPUT_IMAGE_VERSION}" \
          "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          "${GITHUB_SHA}"

    - name: Publish verified image tags
      if: inputs.publish == 'true'
      shell: bash
      env:
        INPUT_TAGS: ${{ inputs.tags }}
      run: |
        build_arch="$(uname -m)"
        build_image="index.docker.io/streamarr/streamarr-server:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${build_arch}"
        for tag in ${INPUT_TAGS}; do
          docker tag "${build_image}" "${tag}"
          docker push "${tag}"
        done
