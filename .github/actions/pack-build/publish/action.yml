name: Publish native server image
description: Push a verified local image and record its immutable digest
inputs:
  image:
    description: Verified image in the local Docker daemon
    required: true
  architecture:
    description: Native image architecture
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        LOCAL_IMAGE: ${{ inputs.image }}
        ARCHITECTURE: ${{ inputs.architecture }}
      run: '"${ACTION_PATH}/../publish-native-image.sh" "${LOCAL_IMAGE}" "${ARCHITECTURE}"'
