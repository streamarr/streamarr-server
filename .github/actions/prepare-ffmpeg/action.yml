name: Prepare FFmpeg redistribution materials
description: Select the declared Node toolchain and generate reviewed materials offline
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: buildpacks/ffmpeg/.nvmrc
        package-manager-cache: false

    - name: Prepare reviewed redistribution materials
      shell: bash
      run: |
        buildpacks/ffmpeg/bin/update-lock --check
        buildpacks/ffmpeg/bin/prepare
