name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    uses: streamarr/streamarr-workflows/.github/workflows/release-please.yml@68ba96a9e641d659e5985aa76c3739e193927de2
    secrets:
      app-client-id: ${{ secrets.ORG_STREAMARR_RELEASE_CLIENT_ID }}
      app-private-key: ${{ secrets.ORG_STREAMARR_RELEASE_PRIVATE_KEY }}
