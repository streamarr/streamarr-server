name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    name: Maintain Maven releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: buildpacks/ffmpeg/.nvmrc
          package-manager-cache: false

      - name: Install release tooling
        run: npm ci --ignore-scripts --prefix .github/release

      - name: Verify release tooling
        run: npm test --prefix .github/release

      - name: Mint release bot token
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID || secrets.FFMPEG_LOCK_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY || secrets.FFMPEG_LOCK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Update and queue release PRs
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: npm run release --prefix .github/release
