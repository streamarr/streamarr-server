name: Preview Image

on:
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  build_preview:
    if: >
      github.event.issue.pull_request
      && github.event.comment.body == '/deploy-preview'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false

      - name: Resolve PR head SHA
        id: pr_head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and verify preview image
        uses: ./.github/actions/pack-build
        with:
          tags: streamarr/streamarr-server:pr-${{ github.event.issue.number }}
          publish: "false"
          image-version: ${{ steps.pr_head.outputs.sha }}

      - name: Archive preview image
        env:
          BUILD_IMAGE: index.docker.io/streamarr/streamarr-server:build-${{ github.run_id }}-${{ github.run_attempt }}-x86_64
        run: |
          set -euo pipefail
          docker image inspect "${BUILD_IMAGE}" >/dev/null
          docker image save --output "${RUNNER_TEMP}/preview-image.tar" "${BUILD_IMAGE}"

      - name: Upload preview image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish_preview:
    needs: build_preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: React to command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Download preview image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-image
          path: ${{ runner.temp }}/preview-image

      - name: Load preview image
        env:
          BUILD_IMAGE: index.docker.io/streamarr/streamarr-server:build-${{ github.run_id }}-${{ github.run_attempt }}-x86_64
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/preview-image/preview-image.tar"
          [[ -f "${archive}" ]] || { echo "Preview image archive is missing" >&2; exit 1; }
          docker image load --input "${archive}"
          docker image inspect "${BUILD_IMAGE}" >/dev/null

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish preview image
        env:
          BUILD_IMAGE: index.docker.io/streamarr/streamarr-server:build-${{ github.run_id }}-${{ github.run_attempt }}-x86_64
          PREVIEW_IMAGE: index.docker.io/streamarr/streamarr-server:pr-${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          docker tag "${BUILD_IMAGE}" "${PREVIEW_IMAGE}"
          docker push "${PREVIEW_IMAGE}"

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const tag = `streamarr/streamarr-server:pr-${context.issue.number}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview image published:\n\n\`\`\`\ndocker pull ${tag}\n\`\`\``
            });
