name: Publish worker contract

'on':
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-worker-contract
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and verify worker contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'streamarr/streamarr-server'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      - name: Publish the contract
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: '1.71.0'
          token: ${{ secrets.BUF_TOKEN }}
          format: true
          lint: true
          breaking: false
          push: true
          push_disable_create: true
          archive: false
          pr_comment: false

      - name: Verify the independent Java consumer
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: bash .github/scripts/verify-buf-consumer.sh

      - name: Retain the verified dependency pin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-contract-pin-${{ github.sha }}
          path: target/buf-consumer-pin.properties
          if-no-files-found: error
