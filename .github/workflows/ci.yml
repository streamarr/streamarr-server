name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect packaging-relevant changes
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ github.ref == 'refs/heads/main' || steps.filter.outputs.packaging == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            packaging:
              - '.github/actions/pack-build/**'
              - '.github/workflows/ci.yml'
              - 'Procfile'
              - 'pom.xml'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
              - 'src/main/java/com/streamarr/server/services/authorization/cedar/**'

  application:
    name: Build and test application (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ unit, integration ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require standalone worker image
        run: bash .github/actions/require-worker-image.sh

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      - name: Set up Buf
        if: matrix.suite == 'unit'
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: '1.71.0'
          setup_only: true

      - name: Validate Protobuf contract
        if: matrix.suite == 'unit'
        run: |
          buf format --diff --exit-code
          buf lint

      - name: Detect breaking Protobuf changes
        if: matrix.suite == 'unit' && github.event_name == 'pull_request'
        run: |
          if git ls-tree -r --name-only "${{ github.event.pull_request.base.sha }}" -- src/main/protobuf | grep -q '\.proto$'; then
            git branch --force buf-base "${{ github.event.pull_request.base.sha }}"
            buf breaking --against '.git#branch=buf-base'
          fi

      - name: Verify deployment image configuration
        if: matrix.suite == 'unit'
        run: python3 -m unittest discover -s deploy/kubernetes/test -p 'test_*.py'

      - name: Verify snapshot publication
        if: matrix.suite == 'unit'
        run: python3 -m unittest discover -s .github/actions/test -p 'test_*.py'

      - name: Build and test
        run: >-
          ./mvnw --batch-mode verify -Pci-${{ matrix.suite }}
          -Dcheckstyle.skip=${{ matrix.suite == 'integration' }}

      # These real-worker tests prove playback continuity across producer replacement.
      - name: Run HLS smoke tests
        if: matrix.suite == 'unit'
        run: >-
          ./mvnw --batch-mode test -Dsurefire.excludedGroups= -Dgroups=SmokeTest
          -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotless.check.skip=true

      - name: Fingerprint compiled classes
        run: python3 .github/actions/coverage.py fingerprint ${{ matrix.suite }}

      - name: Upload unit coverage and compiled classes
        if: matrix.suite == 'unit'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-tests-unit
          path: |
            target/classes/
            target/test-classes/
            target/surefire-reports/
            target/jacoco-output/jacoco-unit-tests.exec
            target/ci-unit-classes.sha256
            target/maven-status/maven-compiler-plugin/compile/default-compile/createdFiles.lst
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

      - name: Upload integration coverage
        if: matrix.suite == 'integration'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-tests-integration
          path: |
            target/failsafe-reports/
            target/jacoco-output/jacoco-integration-tests.exec
            target/ci-integration-classes.sha256
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  analysis:
    name: Verify combined coverage and analyze
    needs: application
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: application-tests-*
          path: target
          merge-multiple: true

      - name: Verify complete and compatible coverage inputs
        run: python3 .github/actions/coverage.py verify-inputs

      - name: Verify combined coverage
        run: |
          ./mvnw --batch-mode jacoco:merge@merge-unit-and-integration \
            jacoco:report@create-merged-report jacoco:check@check-authorization-coverage
          python3 .github/actions/coverage.py verify-report

      - name: Upload combined coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-coverage-report
          path: target/site/jacoco-merged-test-coverage-report/jacoco.xml
          if-no-files-found: error
          retention-days: 7

      - name: Cache SonarCloud packages
        if: env.SONAR_TOKEN != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  package_image:
    name: Build and verify ${{ matrix.architecture }} package image
    needs: changes
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.packaging == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require standalone worker image
        if: matrix.architecture == 'arm64'
        run: bash .github/actions/require-worker-image.sh

      - name: Read Maven image version
        id: image
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("pom.xml").find("{*}version").text)')
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build and verify package image
        uses: ./.github/actions/pack-build
        with:
          tags: streamarr/streamarr-server:sha-${{ github.sha }}-${{ matrix.architecture }}
          publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          image-version: ${{ steps.image.outputs.version }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up JDK 25
        if: matrix.architecture == 'arm64'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      - name: Run HLS smoke tests
        if: matrix.architecture == 'arm64'
        run: >-
          ./mvnw --batch-mode test -Dsurefire.excludedGroups= -Dgroups=SmokeTest
          -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotless.check.skip=true

      - name: Record verified native image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          image="streamarr/streamarr-server:sha-${GITHUB_SHA}-${ARCHITECTURE}"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "${image}")
          jq -n --arg source "${GITHUB_SHA}" --arg architecture "${ARCHITECTURE}" \
            --arg image "streamarr/streamarr-server@${reference##*@}" \
            '{sourceRevision: $source, architecture: $architecture, image: $image}' \
            > "${ARCHITECTURE}-image.json"

      - name: Upload verified native image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-image-${{ matrix.architecture }}
          path: ${{ matrix.architecture }}-image.json
          if-no-files-found: error
          retention-days: 7

  publish_snapshot:
    name: Publish multi-architecture snapshot image
    needs: [ build, package_image ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-snapshot-images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download verified native images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-image-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified snapshot image
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/actions/publish-snapshot.sh

  build:
    name: build
    needs: [ changes, application, analysis, package_image ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify required checks
        run: >-
          .github/actions/verify-required-checks.sh
          '${{ needs.changes.result }}'
          '${{ needs.changes.outputs.packaging }}'
          '${{ needs.application.result }}'
          '${{ needs.package_image.result }}'
          '${{ needs.analysis.result }}'
