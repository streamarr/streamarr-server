name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect packaging-relevant changes
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            packaging:
              - 'buildpacks/**'
              - '.github/actions/pack-build/**'
              - '.github/workflows/ci.yml'
              - 'Procfile'

  ffmpeg_lock:
    name: Verify FFmpeg lock
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: proposed
          persist-credentials: false

      - name: Validate FFmpeg lock offline
        run: trusted/buildpacks/ffmpeg/bin/update-lock --root proposed --check

      - name: Verify FFmpeg lock against upstream
        if: needs.changes.outputs.packaging == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: trusted/buildpacks/ffmpeg/bin/update-lock --root proposed --verify-upstream

  application:
    name: Build and test application
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      - name: Set up Buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          version: '1.71.0'
          setup_only: true

      - name: Validate Protobuf contract
        run: |
          buf format --diff --exit-code
          buf lint

      - name: Detect breaking Protobuf changes
        if: github.event_name == 'pull_request'
        run: |
          if git ls-tree -r --name-only "${{ github.event.pull_request.base.sha }}" -- src/main/protobuf | grep -q '\.proto$'; then
            git branch --force buf-base "${{ github.event.pull_request.base.sha }}"
            buf breaking --against '.git#branch=buf-base'
          fi

      - name: Build and test
        run: ./mvnw --batch-mode verify

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The SmokeTest group is excluded from the regular build (needs real FFmpeg) but is fast
      # (~14 tests, seconds) and deterministic, so it gates every PR — it is the only check of
      # ADR 0019's end-to-end guarantees (PTS continuity across producer replacement, fMP4 init
      # rewrite). Kept as its own step so a smoke failure is legible at a glance.
      - name: Run HLS smoke tests
        run: >-
          ./mvnw --batch-mode test -Dsurefire.excludedGroups= -Dgroups=SmokeTest
          -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotless.check.skip=true

      - name: Cache SonarCloud packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  package_image:
    name: Build and verify ${{ matrix.architecture }} package image
    needs: [ changes, ffmpeg_lock ]
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and verify package image
        uses: ./.github/actions/pack-build
        with:
          tags: streamarr/streamarr-server:ci-${{ github.run_id }}-${{ matrix.architecture }}
          publish: "false"
          image-version: ${{ github.sha }}

  build:
    name: build
    needs: [ changes, ffmpeg_lock, application, package_image ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify required checks
        run: >-
          .github/actions/verify-required-checks.sh
          '${{ needs.changes.result }}'
          '${{ needs.changes.outputs.packaging }}'
          '${{ needs.ffmpeg_lock.result }}'
          '${{ needs.application.result }}'
          '${{ needs.package_image.result }}'
