name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect packaging-relevant changes
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
      ffmpeg: ${{ steps.filter.outputs.ffmpeg }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ffmpeg:
              - 'buildpacks/ffmpeg/release'
              - 'buildpacks/ffmpeg/ffmpeg.lock'
              - 'buildpacks/ffmpeg/bin/update-lock'
              - 'buildpacks/ffmpeg/lib/**'
            packaging:
              - 'buildpacks/**'
              - '.github/actions/pack-build/**'
              - '.github/actions/setup-ffmpeg/**'
              - '.github/actions/prepare-ffmpeg/**'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
              - 'Procfile'
              - 'pom.xml'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
              - 'src/main/java/com/streamarr/server/services/authorization/cedar/**'

  ffmpeg_lock:
    name: Verify FFmpeg lock
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate FFmpeg lock offline
        uses: ./.github/actions/prepare-ffmpeg

      - name: Verify FFmpeg lock against upstream
        if: needs.changes.outputs.ffmpeg == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: buildpacks/ffmpeg/bin/update-lock --verify-upstream

  application:
    name: Build and test application (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ unit, integration ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      - name: Prepare FFmpeg tooling
        uses: ./.github/actions/prepare-ffmpeg

      - name: Set up Buf
        if: matrix.suite == 'unit'
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          version: '1.71.0'
          setup_only: true

      - name: Validate Protobuf contract
        if: matrix.suite == 'unit'
        run: |
          buf format --diff --exit-code
          buf lint

      - name: Detect breaking Protobuf changes
        if: matrix.suite == 'unit' && github.event_name == 'pull_request'
        run: |
          if git ls-tree -r --name-only "${{ github.event.pull_request.base.sha }}" -- src/main/protobuf | grep -q '\.proto$'; then
            git branch --force buf-base "${{ github.event.pull_request.base.sha }}"
            buf breaking --against '.git#branch=buf-base'
          fi

      - name: Build and test
        run: >-
          ./mvnw --batch-mode verify -Pci-${{ matrix.suite }}
          -Dcheckstyle.skip=${{ matrix.suite == 'integration' }}

      - name: Install locked FFmpeg
        if: matrix.suite == 'unit'
        timeout-minutes: 10
        uses: ./.github/actions/setup-ffmpeg

      # The SmokeTest group is excluded from the regular build (needs real FFmpeg) but is fast
      # (~14 tests, seconds) and deterministic, so it gates every PR — it is the only check of
      # ADR 0019's end-to-end guarantees (PTS continuity across producer replacement, fMP4 init
      # rewrite). Kept as its own step so a smoke failure is legible at a glance.
      - name: Run HLS smoke tests
        if: matrix.suite == 'unit'
        run: >-
          ./mvnw --batch-mode test -Dsurefire.excludedGroups= -Dgroups=SmokeTest
          -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotless.check.skip=true

      - name: Fingerprint compiled classes
        run: python3 .github/actions/coverage.py fingerprint ${{ matrix.suite }}

      - name: Upload unit coverage and compiled classes
        if: matrix.suite == 'unit'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-tests-unit
          path: |
            target/classes/
            target/test-classes/
            target/surefire-reports/
            target/jacoco-output/jacoco-unit-tests.exec
            target/ci-unit-classes.sha256
            target/maven-status/maven-compiler-plugin/compile/default-compile/createdFiles.lst
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

      - name: Upload integration coverage
        if: matrix.suite == 'integration'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-tests-integration
          path: |
            target/failsafe-reports/
            target/jacoco-output/jacoco-integration-tests.exec
            target/ci-integration-classes.sha256
          if-no-files-found: error
          compression-level: 1
          retention-days: 7

  analysis:
    name: Verify combined coverage and analyze
    needs: application
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: application-tests-*
          path: target
          merge-multiple: true

      - name: Verify complete and compatible coverage inputs
        run: python3 .github/actions/coverage.py verify-inputs

      - name: Verify combined coverage
        run: |
          ./mvnw --batch-mode jacoco:merge@merge-unit-and-integration \
            jacoco:report@create-merged-report jacoco:check@check-authorization-coverage
          python3 .github/actions/coverage.py verify-report

      - name: Upload combined coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-coverage-report
          path: target/site/jacoco-merged-test-coverage-report/jacoco.xml
          if-no-files-found: error
          retention-days: 7

      - name: Cache SonarCloud packages
        if: env.SONAR_TOKEN != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  package_image:
    name: Build and verify ${{ matrix.architecture }} package image
    needs: [ changes, ffmpeg_lock ]
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and verify package image
        uses: ./.github/actions/pack-build
        with:
          tags: streamarr/streamarr-server:ci-${{ github.run_id }}-${{ matrix.architecture }}
          publish: "false"
          image-version: ${{ github.sha }}

      - name: Set up JDK 25
        if: matrix.architecture == 'arm64'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      - name: Install locked FFmpeg
        if: matrix.architecture == 'arm64'
        timeout-minutes: 10
        uses: ./.github/actions/setup-ffmpeg

      - name: Run HLS smoke tests
        if: matrix.architecture == 'arm64'
        run: >-
          ./mvnw --batch-mode test -Dsurefire.excludedGroups= -Dgroups=SmokeTest
          -Djacoco.skip=true -Dcheckstyle.skip=true -Dspotless.check.skip=true

  build:
    name: build
    needs: [ changes, ffmpeg_lock, application, analysis, package_image ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify required checks
        run: >-
          .github/actions/verify-required-checks.sh
          '${{ needs.changes.result }}'
          '${{ needs.changes.outputs.packaging }}'
          '${{ needs.ffmpeg_lock.result }}'
          '${{ needs.application.result }}'
          '${{ needs.package_image.result }}'
          '${{ needs.analysis.result }}'
