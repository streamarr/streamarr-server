name: Release Publisher

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag to retry (vX.Y.Z)
        required: true
        type: string
  release:
    types:
      - released

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  validate_release:
    name: Validate release version and revision
    permissions:
      contents: read
    uses: streamarr/streamarr-workflows/.github/workflows/validate-release.yml@768aa58c4d37fd4b049780b01adffdf38feb3b79
    with:
      tag: ${{ inputs.tag || '' }}

  build_release_images:
    name: Build and verify ${{ matrix.architecture }} image
    needs: validate_release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate_release.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and verify package image
        id: package
        uses: $/.github/actions/pack-build
        with:
          image-version: ${{ needs.validate_release.outputs.version }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified native image
        uses: $/.github/actions/pack-build/publish
        with:
          image: ${{ steps.package.outputs.image }}
          architecture: ${{ matrix.architecture }}

      - name: Upload verified native image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-release-image-${{ matrix.architecture }}
          path: ${{ matrix.architecture }}-image.json
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Publish multi-architecture release image
    needs: [validate_release, build_release_images]
    permissions:
      contents: read
    uses: streamarr/streamarr-workflows/.github/workflows/publish-image.yml@768aa58c4d37fd4b049780b01adffdf38feb3b79
    with:
      image-repository: streamarr/streamarr-server
      source-revision: ${{ needs.validate_release.outputs.revision }}
      version: ${{ needs.validate_release.outputs.version }}
      artifact-pattern: server-release-image-*
      publication-kind: release
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
