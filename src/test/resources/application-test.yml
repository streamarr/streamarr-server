spring:
  datasource:
    hikari:
      maximum-pool-size: 10

auth:
  token:
    # Fixed checked-in EC P-256 test key (base64 PKCS#8) so tokens verify across cached
    # Spring contexts and pre-minted expired tokens stay deterministic. Never used outside
    # tests.
    signing-key: MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQga+ZKCbAcyZIb7k2FE8rMPFtIpTdzX2dR/csZ8k6A95uhRANCAAQawOmVKMDLAOsboxKLb9khGsWyxwcIikucXDCfX18ME5X9/kqSS2vdMnFfZ6KR12U/Sy/EwOwnc82xFAyFdNbe
  argon2:
    # Weak params (~1-3 ms/hash) keep login/setup tests fast; params are config per ADR 0016.
    memory-kib: 4096
    iterations: 1
    parallelism: 1

streamarr:
  # Set on the shared test profile rather than per-test: a @TestPropertySource here would fork
  # the context cache. The unconfigured and cleartext-gate paths are unit-tested on
  # CanonicalBaseUrl instead.
  base-url: https://home.example.test
