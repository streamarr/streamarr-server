spring:
  jpa:
    open-in-view: false
    properties:
      hibernate:
        type:
          # Bind java.time values through JDBC directly. The java.sql.Date and java.sql.Timestamp
          # path converts through the JVM zone and the Julian calendar, which moves dates the zone
          # skipped and instants before the Gregorian cutover.
          java_time_use_direct_jdbc: true
          preferred_instant_jdbc_type: TIMESTAMP_WITH_TIMEZONE
  flyway:
    table: schema_history
    enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/streamarr
    username: admin
    password: pass
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:30}

  threads:
    virtual:
      enabled: true

  # Subscriptions use graphql-transport-ws on the same path as HTTP queries and mutations.
  graphql:
    websocket:
      path: /graphql
      connection-init-timeout: ${GRAPHQL_WEBSOCKET_CONNECTION_INIT_TIMEOUT:10s}
      # Below the common 60 s reverse-proxy idle timeout.
      keep-alive: ${GRAPHQL_WEBSOCKET_KEEP_ALIVE:20s}

graphql:
  subscriptions:
    operation-buffer: ${GRAPHQL_SUBSCRIPTION_OPERATION_BUFFER:64}
    max-operations-per-connection: ${GRAPHQL_SUBSCRIPTION_MAX_OPERATIONS_PER_CONNECTION:32}
    connection-send-buffer: ${GRAPHQL_SUBSCRIPTION_CONNECTION_SEND_BUFFER:1MB}
    delivery-fetch-timeout: ${GRAPHQL_SUBSCRIPTION_DELIVERY_FETCH_TIMEOUT:10s}

dgs:
  graphql:
    graphiql:
      enabled: false
    introspection:
      enabled: false

# The REST contract is published as OpenAPI under the dev and test profiles only; the pinned
# copy for client codegen is docs/openapi.json (OpenApiContractIT keeps it current).
springdoc:
  api-docs:
    enabled: false
    version: openapi_3_1
  paths-to-match: /api/**
  writer-with-order-by-keys: true

# Web-exposed actuator endpoints are an explicit allowlist: health only. Heap dumps and other
# diagnostics stay off the wire — ADR 0016's in-memory secret handling depends on it.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      status:
        order: DOWN,OUT_OF_SERVICE,UP,DEGRADED,UNKNOWN
      group:
        metadata:
          include: tmdb
          status:
            order: DEGRADED,DOWN,OUT_OF_SERVICE,UP,UNKNOWN
            http-mapping:
              degraded: 503
              down: 503
              out-of-service: 503

tmdb:
  api:
    base-url: ${TMDB_API_BASE_URL:https://api.themoviedb.org/3}
    token: ${TMDB_API_TOKEN:}
    cache-size-mb: ${TMDB_API_CACHE_SIZE_MB:200}
    requests-per-second: ${TMDB_API_REQUESTS_PER_SECOND:35}
    request-timeout-seconds: ${TMDB_API_REQUEST_TIMEOUT_SECONDS:30}
  health:
    probe-timeout: ${TMDB_HEALTH_PROBE_TIMEOUT:2s}
    cache-ttl: ${TMDB_HEALTH_CACHE_TTL:30s}
  image:
    base-url: ${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p/original}

image:
  storage-path: ${IMAGE_STORAGE_PATH:}
  replacement-lock-timeout: ${IMAGE_REPLACEMENT_LOCK_TIMEOUT:5s}

# CPU-heavy work, such as decoding and resizing images, holds one of these permits while it runs.
# Primary work gets a freed permit before background work. 0 means one per available processor.
cpu:
  permits: ${CPU_PERMITS:0}

artwork:
  # Artwork steps run as db-scheduler task instances on two schedulers with their own tables:
  # primary artwork (movies, series, seasons and episodes) and background artwork (people and
  # companies). Each thread count caps how many targets' steps run at once on that scheduler.
  scheduling:
    primary-threads: ${ARTWORK_PRIMARY_THREADS:16}
    background-threads: ${ARTWORK_BACKGROUND_THREADS:4}
  runs:
    # How often a scan or refresh that waits for primary artwork checks its recorded results.
    result-check-interval: ${ARTWORK_RESULT_CHECK_INTERVAL:2s}
    # How often an admitted scan or refresh task checks the recorded results of the primary artwork
    # it requested. The task holds its admission while it waits, so the wait counts in its latency.
    task-result-check-interval: ${ARTWORK_TASK_RESULT_CHECK_INTERVAL:100ms}
  progress-log-interval: ${ARTWORK_PROGRESS_LOG_INTERVAL:30s}
  request-lock:
    # How long saving an artwork request or an attempt's artwork results waits for the target's
    # request lock and request row before it fails. A failed save is retried by the target's
    # scheduled task, or fails the metadata transaction that requested the artwork.
    timeout: ${ARTWORK_LOCK_TIMEOUT:5s}

streaming:
  max-concurrent-transcodes: ${STREAMING_MAX_CONCURRENT_TRANSCODES:8}
  target-segment-duration: ${STREAMING_TARGET_SEGMENT_DURATION:6s}
  session-timeout: ${STREAMING_SESSION_TIMEOUT:60s}
  session-retention: ${STREAMING_SESSION_RETENTION:24h}
  producer-stall-threshold: ${STREAMING_PRODUCER_STALL_THRESHOLD:10s}
  segment-base-path: ${STREAMING_SEGMENT_BASE_PATH:}
  worker-session:
    address: ${STREAMING_WORKER_SESSION_ADDRESS:127.0.0.1}
    port: ${STREAMING_WORKER_SESSION_PORT:9090}
    probe-timeout: ${STREAMING_WORKER_SESSION_PROBE_TIMEOUT:1m}
    # A packet scan demuxes the whole source, which is slow on network storage.
    keyframe-scan-timeout: ${STREAMING_WORKER_SESSION_KEYFRAME_SCAN_TIMEOUT:30m}
    probe-cancellation-timeout: ${STREAMING_WORKER_SESSION_PROBE_CANCELLATION_TIMEOUT:5s}
    start-report-timeout: ${STREAMING_WORKER_SESSION_START_REPORT_TIMEOUT:10s}
    # After this time without hearing from a worker, the server pings it, and closes the connection
    # when no acknowledgement arrives within the timeout. The time must be at least 10s.
    keepalive:
      time: ${STREAMING_WORKER_SESSION_KEEPALIVE_TIME:30s}
      timeout: ${STREAMING_WORKER_SESSION_KEEPALIVE_TIMEOUT:10s}
  remote:
    source-namespace-id: ${STREAMING_REMOTE_SOURCE_NAMESPACE_ID:}
    source-root: ${STREAMING_REMOTE_SOURCE_ROOT:}
  watch-progress:
    min-played-percent: ${STREAMING_WATCH_PROGRESS_MIN_RESUME_PERCENT:5.0}
    max-played-percent: ${STREAMING_WATCH_PROGRESS_MAX_RESUME_PERCENT:90.0}
    max-remaining-seconds: ${STREAMING_WATCH_PROGRESS_MAX_REMAINING_SECONDS:300}

dev:
  seed-identity: ${DEV_SEED_IDENTITY:true}
  admin-email: ${DEV_ADMIN_EMAIL:admin@dev.local}
  admin-password: ${DEV_ADMIN_PASSWORD:streamarr-dev}

server:
  # Enable NATIVE or FRAMEWORK behind a trusted reverse proxy to journal forwarded client addresses.
  # The address is recorded but does not affect throttling.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}

auth:
  token:
    signing-key: ${AUTH_TOKEN_SIGNING_KEY:}
    issuer: ${AUTH_TOKEN_ISSUER:streamarr}
    audience: ${AUTH_TOKEN_AUDIENCE:streamarr}
    verification-keys: ${AUTH_TOKEN_VERIFICATION_KEYS:}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:10m}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:30d}
    rotation-grace: ${AUTH_ROTATION_GRACE:30s}
    reauthentication-window: ${AUTH_REAUTHENTICATION_WINDOW:5m}
  argon2:
    memory-kib: ${AUTH_ARGON2_MEMORY_KIB:19456}
    iterations: ${AUTH_ARGON2_ITERATIONS:2}
    parallelism: ${AUTH_ARGON2_PARALLELISM:1}
  cookies:
    # Safari refuses to store or send a Secure cookie over plain HTTP, localhost included, so
    # cookie-mode login silently yields an unauthenticated session in local development. Honored
    # only alongside a dev or test profile; set without one, startup fails.
    allow-insecure: ${AUTH_COOKIES_ALLOW_INSECURE:false}
  # Opaque one-time codes (ADR 0024): how long an invitation and a password-reset code stay
  # redeemable, and how long issuance and redemption wait for the replacement advisory lock and
  # the Account row locks before answering RESOURCE_BUSY.
  credential-codes:
    invitation-ttl: ${AUTH_INVITATION_TTL:7d}
    password-reset-ttl: ${AUTH_PASSWORD_RESET_TTL:1h}
    replacement-lock-timeout: ${AUTH_CREDENTIAL_REPLACEMENT_LOCK_TIMEOUT:5s}
  device:
    code-ttl: ${AUTH_DEVICE_CODE_TTL:10m}
    poll-interval-seconds: ${AUTH_DEVICE_POLL_INTERVAL_SECONDS:5}
    verification-path: ${AUTH_DEVICE_VERIFICATION_PATH:/link}
    max-outstanding-codes: ${AUTH_DEVICE_MAX_OUTSTANDING_CODES:50}
    # A bare legacy AUTH_DEVICE_SWEEP_INTERVAL_MS value remains milliseconds; duration suffixes are preferred.
    sweep-interval: ${AUTH_DEVICE_SWEEP_INTERVAL_MS:15m}

streamarr:
  # The externally reachable base URL. Absent means device pairing is off; the server never
  # invents an address a container cannot know.
  base-url: ${STREAMARR_BASE_URL:}
  # Honored only together with a development or test profile.
  allow-insecure-http: ${STREAMARR_ALLOW_INSECURE_HTTP:false}

otel:
  sdk:
    disabled: true

# Media file probes run as db-scheduler task instances (ADR 0032). threads caps concurrent probes
# even though executions run on virtual threads.
db-scheduler:
  threads: ${PROBE_MAX_CONCURRENT:2}
  polling-interval: ${PROBE_POLLING_INTERVAL:1s}
  polling-strategy: lock-and-fetch
  polling-strategy-upper-limit-fraction-of-threads: 1.0
  heartbeat-interval: ${PROBE_HEARTBEAT_INTERVAL:15s}
  missed-heartbeats-limit: 4
  immediate-execution-enabled: true
  delay-startup-until-context-ready: true
  shutdown-max-wait: 30s

# A probe that finds every compatible worker busy stays pending and runs again after this delay,
# without counting as a failure.
probe:
  busy-worker-retry-delay: ${PROBE_BUSY_WORKER_RETRY_DELAY:5s}
  # How often a scan that waits for its probes checks their stored results.
  result-check-interval: ${PROBE_RESULT_CHECK_INTERVAL:2s}
  # Keyframe packet scans run on their own scheduler with this many threads, apart from the probe
  # threads above. Each scan holds a thread and a worker slot for the whole scan.
  max-concurrent-keyframe-packet-scans: ${PROBE_MAX_CONCURRENT_KEYFRAME_PACKET_SCANS:1}

library:
  # Scans and refreshes run as library operations on their own db-scheduler with its own table.
  # The thread count caps how many operations run at once; further operations show their busy
  # status and wait for a thread.
  operation-scheduling:
    threads: ${LIBRARY_OPERATION_THREADS:8}
  watcher:
    stabilization-period-seconds: ${LIBRARY_WATCHER_STABILIZATION_PERIOD:30}
    poll-interval-seconds: ${LIBRARY_WATCHER_POLL_INTERVAL:5}
    max-wait-seconds: ${LIBRARY_WATCHER_MAX_WAIT:3600}
