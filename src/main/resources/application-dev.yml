streaming:
  remote:
    source-namespace-id: ${STREAMING_REMOTE_SOURCE_NAMESPACE_ID:cccccccc-cccc-cccc-cccc-cccccccccccc}
    source-root: ${STREAMING_REMOTE_SOURCE_ROOT:/media}
  worker-session:
    loopback:
      enabled: ${STREAMING_WORKER_SESSION_LOOPBACK_ENABLED:true}

spring:
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        generate_statistics: true

dgs:
  graphql:
    graphiql:
      enabled: true
    introspection:
      enabled: true

springdoc:
  api-docs:
    enabled: true
