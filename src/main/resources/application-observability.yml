otel:
  sdk:
    disabled: false
  service:
    name: streamarr-server
  exporter:
    otlp:
      endpoint: http://otel-collector:4318
      protocol: http/protobuf
  resource:
    attributes:
      deployment.environment: ${DEPLOYMENT_ENV:dev}
  traces:
    sampler:
      arg: 1.0
  # Micrometer exports every meter, JVM metrics included. The SDK's metric exporter would send its
  # own JVM metrics a second time, and its Micrometer bridge keeps exporting removed meters.
  metrics:
    exporter: none

# Metrics follow the OpenTelemetry starter's endpoint and resource, so OTEL_EXPORTER_OTLP_ENDPOINT
# and OTEL_SERVICE_NAME move spans, logs and metrics together.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  otlp:
    metrics:
      export:
        enabled: true
        url: ${otel.exporter.otlp.endpoint}/v1/metrics
  opentelemetry:
    resource-attributes:
      service.name: ${otel.service.name}
      deployment.environment: ${otel.resource.attributes.deployment.environment}
  # The SDK's HTTP server histogram is not exported, so Micrometer's request timer carries the buckets.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
