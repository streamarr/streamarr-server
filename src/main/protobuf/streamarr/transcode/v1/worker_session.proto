syntax = "proto3";

package streamarr.transcode.v1;

import "google/protobuf/duration.proto";

option java_multiple_files = true;
option java_outer_classname = "WorkerSessionProto";
option java_package = "com.streamarr.transcode.v1";

// UUID bits use the same most-significant/least-significant layout as java.util.UUID.
message Uuid {
  fixed64 most_significant_bits = 1;
  fixed64 least_significant_bits = 2;
}

message WorkerIdentity {
  Uuid worker_id = 1;
  Uuid boot_id = 2;
}

enum ContainerFormat {
  CONTAINER_FORMAT_UNSPECIFIED = 0;
  CONTAINER_FORMAT_MPEG_TS = 1;
  CONTAINER_FORMAT_FMP4 = 2;
}

enum EncoderKind {
  ENCODER_KIND_UNSPECIFIED = 0;
  ENCODER_KIND_HARDWARE = 1;
  ENCODER_KIND_SOFTWARE = 2;
}

// The encoder a worker actually runs for a codec family. Every job attempt of a variant must use
// the encoder backend that the variant's first job attempt used, because the backend decides the
// variant's initialization segment.
message VideoEncoderBackend {
  VideoCodecFamily codec_family = 1;
  // The FFmpeg encoder name, such as libx264 or h264_nvenc.
  string encoder = 2;
  EncoderKind kind = 3;
}

// An encoder that passed the worker's test encode and that the worker advertises. A worker-verified
// encoder is not necessarily keyframe-verified.
message WorkerVerifiedVideoEncoder {
  VideoEncoderBackend backend = 1;
  // True when ADR 0037 lists the encoder, with the encoder settings that the worker runs, as
  // keyframe-verified. For example, ADR 0037 lists the VideoToolbox encoders only with B-frames
  // off. The worker takes the flag from that list and never derives it from its own output.
  bool keyframe_verified = 2;
}

message WorkerCapabilities {
  repeated Uuid source_namespace_ids = 1;
  // Supported nonzero versions of Streamarr's retained probe fields and their interpretation.
  // These are independent of the installed FFmpeg and ffprobe versions. The probe versions are 1, 3
  // and 4. Version 3 adds keyframe positions. Version 4 adds the dynamic range, bit depth, chroma
  // subsampling, rotation, container cropping and codec string of each stream, the HDR10 static
  // metadata of each video stream, the end time of each audio and video stream, the sample rate
  // and profile of each audio stream, the chosen video stream, the output frame rate and the
  // container's chapters. Each version reports every fact of
  // the versions before it. Version 2 is unused: no server requests it and no worker advertises it.
  repeated uint32 probe_versions = 2;
  // One entry for each codec family the worker can encode: the encoder backend that the worker
  // runs for every job of that codec family. Every entry, hardware or software, passed the worker's
  // test encode. The server counts a hardware encoder backend only after the backend also passes
  // the checks that ADR 0037 sets.
  repeated WorkerVerifiedVideoEncoder video_encoders = 3;
}

message WorkerRegistration {
  // This worker describes itself; target is reserved for server commands addressed to a worker.
  WorkerIdentity worker = 1;
  WorkerCapabilities capabilities = 2;
  // Configured slot capacity for this connection, fixed at registration; the server derives
  // remaining capacity from its own active-attempt accounting. Probes and variants share it.
  uint32 available_slots = 3;
}

enum TranscodeMode {
  TRANSCODE_MODE_UNSPECIFIED = 0;
  TRANSCODE_MODE_REMUX = 1;
  TRANSCODE_MODE_AUDIO_TRANSCODE = 2;
  TRANSCODE_MODE_VIDEO_TRANSCODE = 3;
  TRANSCODE_MODE_FULL_TRANSCODE = 4;
}

enum AudioMode {
  AUDIO_MODE_UNSPECIFIED = 0;
  AUDIO_MODE_COPY = 1;
  AUDIO_MODE_TRANSCODE = 2;
  AUDIO_MODE_NONE = 3;
}

enum SubtitleMode {
  SUBTITLE_MODE_UNSPECIFIED = 0;
  SUBTITLE_MODE_EXCLUDE = 1;
  SUBTITLE_MODE_BURN_IN = 2;
  SUBTITLE_MODE_SIDECAR = 3;
  SUBTITLE_MODE_HLS = 4;
  SUBTITLE_MODE_EMBED = 5;
}

message AudioDecision {
  AudioMode mode = 1;
  optional string codec = 2;
  uint32 channels = 3;
  uint64 bitrate_bits_per_second = 4;
}

message SubtitleDecision {
  SubtitleMode mode = 1;
  optional string codec = 2;
  optional uint32 stream_index = 3;
  optional string language = 4;
}

enum VideoCodecFamily {
  VIDEO_CODEC_FAMILY_UNSPECIFIED = 0;
  VIDEO_CODEC_FAMILY_H264 = 1;
  VIDEO_CODEC_FAMILY_HEVC = 2;
  VIDEO_CODEC_FAMILY_AV1 = 3;
}

// Each codec profile belongs to one codec family. The worker fails the job attempt with
// JOB_ATTEMPT_FAILURE_INVALID_SPECIFICATION when codec_profile belongs to a codec family other than
// codec_family.
enum VideoCodecProfile {
  VIDEO_CODEC_PROFILE_UNSPECIFIED = 0;
  VIDEO_CODEC_PROFILE_H264_HIGH = 1;
  VIDEO_CODEC_PROFILE_HEVC_MAIN = 2;
  VIDEO_CODEC_PROFILE_AV1_MAIN = 3;
}

// A copy carries VIDEO_CODEC_TIER_UNSPECIFIED. H.264 has no tier, so an H.264 encode also carries
// VIDEO_CODEC_TIER_UNSPECIFIED.
enum VideoCodecTier {
  VIDEO_CODEC_TIER_UNSPECIFIED = 0;
  VIDEO_CODEC_TIER_MAIN = 1;
  VIDEO_CODEC_TIER_HIGH = 2;
}

enum VideoMode {
  VIDEO_MODE_UNSPECIFIED = 0;
  VIDEO_MODE_COPY = 1;
  VIDEO_MODE_ENCODE = 2;
}

// Whether a dynamic-range feature is present, as ADR 0036 defines it. UNSPECIFIED means that the
// probe could not check. ABSENT means that the probe checked and found none.
enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  PRESENCE_ABSENT = 1;
  PRESENCE_PRESENT = 2;
}

// The standard picture format that a player could use without the advanced HDR information. The
// probe derives it from the signaled transfer and the Dolby Vision claim. When a Dolby Vision
// compatibility identifier disagrees with the signaled transfer, the signaled transfer decides.
enum CompatibleBase {
  // The probe could not read the transfer and found no Dolby Vision claim.
  COMPATIBLE_BASE_UNSPECIFIED = 0;
  // The stream has no standard compatible base. Dolby Vision declares none, or the signaled
  // transfer is unspecified while Dolby Vision is present, as in Dolby Vision profile 5.
  COMPATIBLE_BASE_NONE = 1;
  // A standard-dynamic-range transfer, such as BT.709.
  COMPATIBLE_BASE_SDR = 2;
  // SMPTE ST 2084, which covers HDR10 and PQ10.
  COMPATIBLE_BASE_PQ = 3;
  // ARIB STD-B67.
  COMPATIBLE_BASE_HLG = 4;
}

// The Dolby Vision configuration record (dvcC or dvvC), kept whole. Every value in it is a claim.
// The worker sets every field that the record holds. The numeric fields have explicit presence,
// because 0 is a real base-layer compatibility identifier.
message DolbyVisionConfiguration {
  // The Dolby Vision profile, which is separate from the codec profile.
  optional uint32 profile = 1;
  // The Dolby Vision level, which is separate from the codec level.
  optional uint32 level = 2;
  optional uint32 base_layer_compatibility_id = 3;
  // The record's bl_present_flag.
  bool base_layer = 4;
  // The record's el_present_flag.
  bool enhancement_layer = 5;
  // The record's rpu_present_flag.
  bool rpu = 6;
}

// The probe checked for Dolby Vision and found no configuration record, no Dolby Vision sample
// entry and no RPU in the samples. A probe that reads no samples never reports this arm.
message DolbyVisionAbsent {}

// The probe found a Dolby Vision configuration record, a Dolby Vision sample entry or an RPU in the
// samples.
message DolbyVisionPresent {
  // The whole configuration record, or absent when the probe found no record.
  DolbyVisionConfiguration declared = 1;
  // Whether the samples hold Dolby Vision RPUs. UNSPECIFIED when the probe read no samples.
  Presence observed_rpu = 2;
}

// The dynamic range of one video stream, as ADR 0036 defines it. A source video stream can hold
// UNSPECIFIED values. A planned output never holds an UNSPECIFIED value.
message VideoDynamicRange {
  CompatibleBase compatible_base = 1;
  Presence hdr10_plus = 2;
  // No arm set means that Dolby Vision is unspecified: the probe could not check.
  oneof dolby_vision {
    DolbyVisionAbsent dolby_vision_absent = 3;
    DolbyVisionPresent dolby_vision_present = 4;
  }
}

// The server computes codec_profile, tier, level and codec_string. The worker never computes them.
// mode says whether the worker copies or encodes the video. VIDEO_MODE_COPY goes with
// TRANSCODE_MODE_REMUX and TRANSCODE_MODE_AUDIO_TRANSCODE. VIDEO_MODE_ENCODE goes with
// TRANSCODE_MODE_VIDEO_TRANSCODE and TRANSCODE_MODE_FULL_TRANSCODE. The worker fails the job
// attempt with JOB_ATTEMPT_FAILURE_INVALID_SPECIFICATION when mode and TranscodeDecision.mode
// disagree, or when an encode lacks codec_profile or level.
//
// For an encode, the worker forces codec_profile, tier and level. A copy carries no codec_profile,
// tier or level. A copy's codec_string is the one that the probe computed for the source stream.
// The worker fails the job attempt with JOB_ATTEMPT_FAILURE_OUTPUT_MISMATCH when the codec string
// of an initialization segment that it produces differs from codec_string.
//
// The worker chooses how to convert the picture from source_dynamic_range and
// output_dynamic_range, as ADR 0013 decides, and never chooses a conversion on its own. The worker
// fails the job attempt with JOB_ATTEMPT_FAILURE_INVALID_SPECIFICATION in these cases:
// - an encode lacks source_dynamic_range or output_dynamic_range;
// - output_dynamic_range holds an UNSPECIFIED compatible base, an UNSPECIFIED hdr10_plus, or no
//   Dolby Vision arm;
// - a copy carries output_dynamic_range.
message VideoDecision {
  VideoMode mode = 6;
  VideoCodecFamily codec_family = 1;
  VideoCodecProfile codec_profile = 2;
  VideoCodecTier tier = 3;
  // The level as major x 10 + minor, for example 41 for level 4.1.
  optional uint32 level = 4;
  // The RFC 6381 codec string that the variant's playlist advertises, for example avc1.64002A.
  string codec_string = 5;
  // The dynamic range of the chosen video stream, as the probe stored it.
  VideoDynamicRange source_dynamic_range = 7;
  // The dynamic range of the planned output. Only an encode carries it. A copy carries none until
  // streamarr/streamarr-server#396 settles the planned output of a copy.
  VideoDynamicRange output_dynamic_range = 8;
  // The ProbeStreamInfo.index of the chosen video stream: its index in the container. The worker
  // maps that stream. Until the server sets the field, the worker maps the first video stream.
  optional uint32 stream_index = 9;
}

message TranscodeDecision {
  TranscodeMode mode = 1;
  // video.codec_family replaces this string once the server fills video. While the server sends
  // both, the worker fails the job attempt with JOB_ATTEMPT_FAILURE_INVALID_SPECIFICATION when they
  // name different codec families.
  string video_codec_family = 2;
  AudioDecision audio = 3;
  SubtitleDecision subtitle = 4;
  ContainerFormat container = 5;
  reserved 6;
  reserved "align_keyframes_to_segments";
  VideoDecision video = 7;
}

// relative_key is an opaque installation-defined key. It is never a host path and must not be
// percent-decoded or normalized before the selected namespace mapping resolves it.
message MediaSourceRef {
  Uuid source_namespace_id = 1;
  string relative_key = 2;
}

// One name on the preset scale that serves every software encoder.
enum EncoderPreset {
  ENCODER_PRESET_UNSPECIFIED = 0;
  ENCODER_PRESET_ULTRAFAST = 1;
  ENCODER_PRESET_SUPERFAST = 2;
  ENCODER_PRESET_VERYFAST = 3;
  ENCODER_PRESET_FASTER = 4;
  ENCODER_PRESET_FAST = 5;
  ENCODER_PRESET_MEDIUM = 6;
  ENCODER_PRESET_SLOW = 7;
  ENCODER_PRESET_SLOWER = 8;
  ENCODER_PRESET_VERYSLOW = 9;
}

message VariantSpec {
  string variant_label = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint64 bitrate_bits_per_second = 4;
  // The server always sets a preset from the scale and never sends Automatic. Every job attempt of
  // a variant carries the same preset.
  EncoderPreset encoder_preset = 5;
}

message TranscodeExecution {
  uint32 seek_position_seconds = 1;
  uint32 target_segment_duration_seconds = 2;
  double framerate = 3;
  uint32 start_sequence_number = 4;
  // The number of media segments the variant's media playlist advertises on the zero-based grid of
  // target_segment_duration_seconds. Every job attempt of the variant carries the same count,
  // whatever its transcode mode, and its start_sequence_number is below it; a job without the
  // count, or whose start_sequence_number is not below it, is an invalid specification. ADR 0037
  // describes how the worker bounds its list of forced keyframes with it.
  uint32 media_segment_count = 5;
  // The source position where the attempt starts reading, with sub-second precision, on the
  // zero-based timeline of ProbeKeyframePositionsPart. When the field is set, the worker seeks to
  // it instead of seek_position_seconds. The server chooses the position. For an attempt that
  // copies video, the server sends the decode time of the first source keyframe of the attempt's
  // first media segment. This version of the server sets the field for no other attempt.
  google.protobuf.Duration seek_position = 6;
  // The output frame rate that the probe stored for the chosen video stream. The worker passes the
  // exact fraction to FFmpeg and never converts it to a decimal. A job that copies the video
  // carries none. output_frame_rate replaces framerate once the server sets it. When a job carries
  // both, the worker uses output_frame_rate.
  Fraction output_frame_rate = 7;
}

message VariantJob {
  Uuid stream_session_id = 1;
  // job_id identifies one logical variant transcode for the stream session. job_attempt_id is
  // freshly generated for every dispatch attempt and is never a monotonic generation counter.
  Uuid job_id = 2;
  Uuid job_attempt_id = 3;
  MediaSourceRef source = 4;
  TranscodeDecision decision = 5;
  VariantSpec variant = 6;
  TranscodeExecution execution = 7;
}

message JobAttemptStarted {
  Uuid job_attempt_id = 1;
  // The encoder backend that the job attempt runs. Absent when the job attempt copies the video.
  VideoEncoderBackend encoder_backend = 2;
}

enum JobAttemptFailure {
  JOB_ATTEMPT_FAILURE_UNSPECIFIED = 0;
  JOB_ATTEMPT_FAILURE_SOURCE_UNAVAILABLE = 1;
  JOB_ATTEMPT_FAILURE_INVALID_SPECIFICATION = 2;
  JOB_ATTEMPT_FAILURE_STARTUP_FAILED = 3;
  JOB_ATTEMPT_FAILURE_TRANSCODE_FAILED = 4;
  // The produced output differs from the job's video decision. The same decision on the same
  // encoder backend produces the same mismatch, so a replacement job attempt fails the same way.
  JOB_ATTEMPT_FAILURE_OUTPUT_MISMATCH = 5;
}

message JobAttemptFailed {
  Uuid job_attempt_id = 1;
  JobAttemptFailure failure = 2;
}

message JobAttemptCompleted {
  Uuid job_attempt_id = 1;
}

message JobAttemptStopped {
  Uuid job_attempt_id = 1;
}

// One message that a worker sends on its session. The server accepts a message whose protobuf
// encoding takes at most 131,072 bytes (128 KiB). A larger message ends the worker's session, and
// the server then abandons the worker's job attempts and fails its other probes. So the worker
// computes the encoded size of each message before it sends the message. When a probe result would
// not fit, the worker reports PROBE_FAILURE_RESULT_TOO_LARGE instead.
message EstablishWorkerSessionRequest {
  oneof event {
    WorkerRegistration registration = 1;
    JobAttemptStarted job_attempt_started = 2;
    JobAttemptFailed job_attempt_failed = 3;
    JobAttemptCompleted job_attempt_completed = 4;
    JobAttemptStopped job_attempt_stopped = 5;
    ProbeAttemptResult probe_result = 6;
    ProbeKeyframePositionsPart probe_keyframe_positions_part = 7;
  }
}

message WorkerSessionAccepted {
  // A fresh server-issued identifier for this live connection, used to fence segment uploads.
  Uuid worker_session_id = 1;
}

message StartVariantCommand {
  WorkerIdentity target = 1;
  VariantJob job = 2;
}

message ProbeRequest {
  // Present, non-nil identifier for this execution attempt. Every retry uses a fresh identifier.
  Uuid probe_attempt_id = 1;
  // Requested Streamarr probe result contract version. Zero, including omission, is invalid.
  uint32 probe_version = 2;
  MediaSourceRef source = 3;
  // When true, the worker finds keyframe positions by scanning every packet of the chosen video
  // stream instead of reading the container index. Only probe version 3 and later report keyframe
  // positions and accept this flag. A worker answers the flag under probe version 1 with
  // PROBE_FAILURE_UNSUPPORTED_VERSION.
  bool scan_keyframe_packets = 4;
}

message ProbeContainerInfo {
  optional string format = 1;
  google.protobuf.Duration duration = 2;
  optional int64 bitrate_bits_per_second = 3;
  // The container's chapters, as ffprobe -show_chapters lists them, in ffprobe's order. Only probe
  // version 4 and later report chapters. The worker keeps each chapter as ffprobe reports it. The
  // worker never sorts, merges, clamps or generates chapters.
  //
  // A file controls its chapters and their titles, but the result must fit in one session message
  // of at most 128 KiB. So the chapters of one result take at most 32,768 bytes in their protobuf
  // encoding. When the chapters would take more, the worker reports no chapters and sets
  // chapters_omitted.
  repeated ProbeChapter chapters = 4;
  // True when the container has chapters, but the worker omitted them because they exceed the
  // chapter limit. When chapters is empty and chapters_omitted is false, the container has no
  // chapters.
  bool chapters_omitted = 5;
}

// One chapter of the container. Both times are on the timeline of ProbeKeyframePositionsPart, like
// ProbeStreamInfo.end_time: the demuxer time minus the container's start time. The worker computes
// each time from ffprobe's start or end ticks and the chapter's time base, and then subtracts the
// container's start time. A chapter that starts before the container's start time therefore has a
// negative start time.
message ProbeChapter {
  // Absent when ffprobe reports no start time.
  google.protobuf.Duration start_time = 1;
  // Absent when ffprobe reports no end time. When the container states no end for a chapter,
  // FFmpeg ends the chapter at the next chapter's start or at the end of the file, and the worker
  // reports that end.
  google.protobuf.Duration end_time = 2;
  // The chapter's title tag, such as a Matroska ChapString. A title holds at most 512 bytes of
  // UTF-8. Absent when the chapter has no title tag, or when the tag is longer than 512 bytes. The
  // worker never shortens a title.
  optional string title = 3;
}

// An exact fraction whose terms are both positive. For example, 24000/1001 frames per second, or a
// time base of 1/90000 seconds.
message Fraction {
  uint32 numerator = 1;
  uint32 denominator = 2;
}

// How a video stream's pixel format samples chroma.
enum ChromaSubsampling {
  // ffprobe reported no pixel format, or a pixel format with another layout, such as an RGB format.
  CHROMA_SUBSAMPLING_UNSPECIFIED = 0;
  CHROMA_SUBSAMPLING_420 = 1;
  CHROMA_SUBSAMPLING_422 = 2;
  CHROMA_SUBSAMPLING_444 = 3;
  // The pixel format has no chroma planes, as in gray.
  CHROMA_SUBSAMPLING_MONOCHROME = 4;
}

// Only probe version 4 and later report the fields from dynamic_range to is_hearing_impaired.
message ProbeStreamInfo {
  uint32 index = 1;
  string codec_type = 2;
  optional string codec = 3;
  optional string language = 4;
  optional uint32 channels = 5;
  optional int64 bitrate_bits_per_second = 6;
  optional uint32 width = 7;
  optional uint32 height = 8;
  optional double framerate = 9;
  bool is_default = 10;
  bool is_forced = 11;
  // Video streams only. The probe reads the dynamic range from the stream's headers and
  // configuration records and never reads the samples. So Dolby Vision is never ABSENT, and
  // observed_rpu and hdr10_plus are UNSPECIFIED. Dolby Vision is unspecified when the probe finds
  // neither a configuration record nor a Dolby Vision sample entry.
  VideoDynamicRange dynamic_range = 12;
  // Video streams only: the bit depth of a luma sample, from the pixel format. For example, 8 for
  // yuv420p and 10 for yuv420p10le. Absent when ffprobe reports no pixel format.
  optional uint32 bit_depth = 13;
  // Video streams only, from the pixel format.
  ChromaSubsampling chroma_subsampling = 14;
  // Video streams only: the angle, in whole degrees from -180 to 180, by which the stream's display
  // matrix rotates the picture counterclockwise, as ffprobe reports it. A phone recording held
  // upright usually reports -90. Absent when the stream has no display matrix.
  optional sint32 rotation_degrees = 15;
  // Video and audio streams only: the exact RFC 6381 codec string that a stream copy of the stream
  // carries, for example avc1.640028 or mp4a.40.2. The worker computes it from the stream's decoder
  // configuration record, after the tag rule picks the copy's sample entry. A Dolby Vision copy
  // with an SDR compatible base carries its base sample entry, so its codec string starts with
  // hvc1 or avc1. Absent when the worker cannot compute a codec string for the stream's codec.
  optional string codec_string = 16;
  // Video and audio streams only: the media time at which the stream ends, where the container
  // header states the stream's duration. The end time is the stream's start time plus that
  // duration, measured from the container's start time, on the timeline of
  // ProbeKeyframePositionsPart. Absent when the header states no duration for the stream. The
  // worker never reports an estimate, such as a duration derived from the bitrate.
  // streamarr/streamarr-server#511 uses the end time to find a stream that ends early.
  google.protobuf.Duration end_time = 17;
  // Audio streams only: the sample rate in hertz, from ffprobe's sample_rate. Absent when ffprobe
  // reports no sample rate or reports 0. The server's MP3 copy rule needs the sample rate, because
  // the fMP4 muxer refuses MP3 below 16 kHz and writes a different esds objectTypeIndication at or
  // below 24 kHz.
  optional uint32 sample_rate_hz = 18;
  // Audio streams only: ffprobe's profile for the stream, kept as ffprobe prints it, for every
  // audio codec. FFmpeg 8's names include LC, HE-AAC and xHE-AAC for AAC; DTS, DTS-HD MA and
  // DTS-HD MA + DTS:X for DTS; Dolby Digital Plus + Dolby Atmos for E-AC-3; and Dolby TrueHD +
  // Dolby Atmos for TrueHD. When FFmpeg has no name for the profile, ffprobe prints the profile's
  // number, and the worker reports that number as text. Absent when ffprobe reports no profile.
  // The server derives Atmos and the DTS variants from this text. The codec string never comes
  // from it.
  optional string audio_profile = 19;
  // Video streams only: the crop that the container asks for, from ffprobe's Frame Cropping stream
  // side data. A Matroska PixelCrop element or an MP4 clap box carries the crop. Absent when the
  // stream has no Frame Cropping side data.
  ContainerCropping container_cropping = 20;
  // Video streams only: the mastering display color volume that the container declares, from
  // ffprobe's Mastering display metadata stream side data. Absent when the stream has no such side
  // data. MasteringDisplayColorVolume says where the side data comes from and what absent means.
  MasteringDisplayColorVolume mastering_display = 21;
  // Video streams only: the content light level that the container declares, from ffprobe's
  // Content light level metadata stream side data. Absent when the stream has no such side data.
  ContentLightLevel content_light_level = 22;
  // Audio and subtitle streams only: the stream's title, which a menu shows to name the track. The
  // worker reads two stream tags in this order. It takes the first tag whose value is not empty and
  // not only white space. It compares tag keys without regard to case, as FFmpeg's metadata
  // dictionary does.
  //
  // 1. title. ffprobe reports a Matroska TrackName and an MP4 track's ©nam atom as title.
  // 2. name. ffprobe reports an MP4 or MOV track's udta name atom as name. FFmpeg's MP4 and MOV
  //    muxers write a stream's title metadata into that atom, so ffprobe 8 reports such a title as
  //    name, never as title.
  //
  // The worker reports the value of the chosen tag unchanged. Absent when neither tag gives a
  // title. Also absent when the chosen value is longer than 512 bytes of UTF-8. The worker never
  // shortens a title and never falls back to the next tag. Also absent on every stream when the
  // worker sets ProbeMediaInfo.stream_titles_omitted. The worker never takes a title from the
  // handler name. handler_name carries the handler name separately. This rule belongs to probe
  // version 4, and a change to it needs a new probe version. Video streams report no title, because
  // no consumer reads one.
  optional string title = 23;
  // Audio and subtitle streams only: the value of the stream's handler_name tag, unchanged. The
  // worker compares tag keys without regard to case. ffprobe reports the name in an MP4 or MOV
  // track's hdlr box as handler_name, and a Matroska file that FFmpeg remuxed from MP4 keeps that
  // name as a HANDLER_NAME tag. Absent when the stream has no handler_name tag. Also absent when
  // the value is longer than 512 bytes of UTF-8, and on every stream when the worker sets
  // ProbeMediaInfo.stream_titles_omitted. The worker never shortens a handler name.
  //
  // Many muxers write a fixed name for the track's type into every hdlr box. FFmpeg 8 writes
  // SoundHandler and SubtitleHandler. Other muxers write names such as USP Sound Handler, Core
  // Media Audio or ISO Media file produced by Google Inc. Some handler names do name the track,
  // such as English SDH or Surround. The worker reports every handler name as it is, an empty one
  // included. The server decides which handler names are generic when it names a rendition. The
  // list of generic names is open-ended. A rule in the worker would need a new probe version for
  // each fix, and every file would need a new probe.
  optional string handler_name = 24;
  // Audio and subtitle streams only: whether the container marks the stream as made for viewers
  // who are deaf or hard of hearing, from ffprobe's hearing_impaired disposition. Such a subtitle
  // track usually holds SDH subtitles, which also describe sounds. The worker reads the disposition
  // from its existing -show_streams run and needs no new ffprobe argument.
  //
  // FFmpeg 8.1 reads the flag from these sources:
  // - Matroska: the FlagHearingImpaired element. FFmpeg's WebM muxer never writes that element.
  // - MP4: a kind box with the scheme urn:mpeg:dash:role:2011 and the value caption. FFmpeg reads
  //   that box as both the hearing_impaired and the captions disposition, and FFmpeg's MP4 muxer
  //   writes it for either disposition. FFmpeg's MOV muxer writes no kind box. FFmpeg reads no
  //   other MP4 box for the flag, such as the media characteristics that Apple tools write.
  // - MPEG-TS: audio type 2 in an ISO 639 language descriptor, or a DVB subtitling type from 0x20
  //   to 0x25.
  //
  // True when the disposition is 1, and false when it is 0. Absent on video streams, and absent
  // when ffprobe reports no disposition for the stream. False means only that the container does
  // not mark the stream. It never proves that a track lacks sound descriptions, because many SDH
  // tracks carry no flag and some containers cannot carry one. In a 300-file library sample, the
  // flag marked only 25 of the 78 text subtitle tracks whose flag or title said SDH. So the server
  // also reads the title (streamarr/streamarr-server#60).
  optional bool is_hearing_impaired = 25;
}

// The number of pixels that a container crop removes from each edge of the picture. width and
// height stay the size before cropping. A crop in the codec's own headers, such as the H.264
// frame cropping, is separate: width and height already exclude that crop. A transcode applies the
// container crop by default, because FFmpeg's -apply_cropping option defaults to all. The quality
// ladder and the playlist's RESOLUTION use the size after cropping, as they use the size after
// rotation. The worker reports the values as ffprobe prints them and never checks them against
// width and height.
message ContainerCropping {
  uint32 top = 1;
  uint32 bottom = 2;
  uint32 left = 3;
  uint32 right = 4;
}

// The mastering display color volume of SMPTE ST 2086: one half of a stream's HDR10 static
// metadata. ContentLightLevel holds the other half. Both are static values for the whole stream.
// Neither is the raw color signaling. The transfer, primaries, matrix and range of the stream stay
// out of probe version 4.
//
// Every value uses the unit of the HEVC mastering display color volume SEI message (payload type
// 137), and every value fits its SEI field. So streamarr/streamarr-server#396 can write the values
// into that SEI message unchanged, and every job attempt writes the same bytes.
//
// The worker reads the values from the stream side data that ffprobe's -show_streams reports. That
// is the same ffprobe run that reports the stream's other facts. The side data comes from the
// container: an MP4 mdcv box or the Matroska MasteringMetadata element. Some streams carry the
// values only in their HEVC bitstream: in the SEI messages of the hvcC record or of the samples.
// MPEG-TS and raw HEVC files always work this way. Those streams have no such side data. Probe
// version 4 reads no frames, so it reports their mastering display as absent. Absent therefore
// means that the container declares no mastering display. Absent does not mean that the stream
// lacks static HDR metadata. So the server must not treat an absent value as proof of PQ10.
//
// ffprobe prints each value as a fraction. The worker multiplies the fraction by the number of
// units in one whole: 50000 for a chromaticity coordinate, and 10000 for a luminance. The worker
// then rounds to the nearest unit, and rounds a half up. An mdcv box stores the SEI units, so
// ffprobe prints fractions over 50000 and 10000, and the conversion is exact. Matroska stores
// floating-point numbers, so ffprobe prints reduced fractions, such as 177/250 for 35400 units.
// The rounding recovers the units that a muxer wrote from an SEI message. The worker reports the
// message only when ffprobe reports both the primaries and the luminance, and when every value
// fits its SEI field. Otherwise mastering_display is absent.
message MasteringDisplayColorVolume {
  // The three display primaries. The SEI message lists them in the order green, blue, red.
  ChromaticityCoordinates red = 1;
  ChromaticityCoordinates green = 2;
  ChromaticityCoordinates blue = 3;
  ChromaticityCoordinates white_point = 4;
  // The maximum display mastering luminance, in units of 0.0001 cd/m^2, from 0 to 4294967295. For
  // example, 10000000 means 1000 cd/m^2.
  uint32 max_luminance = 5;
  // The minimum display mastering luminance, in units of 0.0001 cd/m^2, from 0 to 4294967295. For
  // example, 50 means 0.005 cd/m^2.
  uint32 min_luminance = 6;
}

// A CIE 1931 chromaticity, in units of 0.00002, as the SEI message stores display_primaries_x,
// display_primaries_y, white_point_x and white_point_y. Each value lies from 0 to 50000. For
// example, x 15635 and y 16450 is the D65 white point, 0.3127 and 0.329.
message ChromaticityCoordinates {
  uint32 x = 1;
  uint32 y = 2;
}

// The content light level of CTA-861.3: the other half of a stream's HDR10 static metadata. Both
// values are in cd/m^2, as the HEVC content light level information SEI message (payload type 144)
// stores them. Each value lies from 0 to 65535. ffprobe prints integers, so the worker reports them
// unchanged. The worker reports the message only when both values fit their SEI fields.
//
// The side data comes from an MP4 clli box or from the Matroska MaxCLL and MaxFALL elements. As
// with MasteringDisplayColorVolume, absent means that the container declares no light level. A
// declared 0 means that the mastering process did not compute that value. 0 is still a declared
// value, so the message is present. ffprobe reports a Matroska light level only when MaxCLL and
// MaxFALL are both nonzero.
message ContentLightLevel {
  // MaxCLL: the maximum content light level.
  uint32 max_content_light_level = 1;
  // MaxFALL: the maximum frame-average light level.
  uint32 max_frame_average_light_level = 2;
}

// The order of the fields of an interlaced frame, as ffprobe reports field_order.
enum FieldOrder {
  // ffprobe reported unknown or no field order.
  FIELD_ORDER_UNSPECIFIED = 0;
  FIELD_ORDER_PROGRESSIVE = 1;
  // Top field coded first and displayed first (ffprobe's tt).
  FIELD_ORDER_TT = 2;
  // Bottom field coded first and displayed first (ffprobe's bb).
  FIELD_ORDER_BB = 3;
  // Top field coded first, bottom field displayed first (ffprobe's tb).
  FIELD_ORDER_TB = 4;
  // Bottom field coded first, top field displayed first (ffprobe's bt).
  FIELD_ORDER_BT = 5;
}

// The basis on which the frame-rate rule of ADR 0037 chose the output frame rate.
enum OutputFrameRateBasis {
  OUTPUT_FRAME_RATE_BASIS_UNSPECIFIED = 0;
  // The declared rates agree on a listed rate, and Matroska's statistics, when present, agree too.
  // streamarr/streamarr-transcode-worker#24 calls this basis "probe".
  OUTPUT_FRAME_RATE_BASIS_DECLARED_RATES = 1;
  // The rule scanned the packets, but Matroska's statistics say that the whole video stream runs
  // faster than its first 30 s, so the rule kept the declared rate. The issue calls this basis
  // "probe (tags)".
  OUTPUT_FRAME_RATE_BASIS_MATROSKA_STATISTICS = 2;
  // The rule snapped the motion rate that the packet scan measured. The issue calls this basis
  // "scan".
  OUTPUT_FRAME_RATE_BASIS_PACKET_SCAN = 3;
  // The scan found fewer than 2 frames, so the rule snapped the average rate, or the base rate when
  // the average rate is not usable. The issue calls this basis "fallback".
  OUTPUT_FRAME_RATE_BASIS_DECLARED_RATE_FALLBACK = 4;
  // The scan found fewer than 2 frames and neither declared rate is usable. The rule chose no rate.
  OUTPUT_FRAME_RATE_BASIS_REFUSED = 5;
}

// Matroska's per-stream statistics tags, NUMBER_OF_FRAMES and DURATION, with any language suffix.
message MatroskaStatistics {
  optional uint64 number_of_frames = 1;
  google.protobuf.Duration duration = 2;
}

// What the frame-rate rule's packet scan measured over the first 30 s of the chosen video stream.
message FrameRatePacketScan {
  // The motion rate in frames per second: the rate at which the video's motion actually runs.
  // Absent when the scan found fewer than 2 frames.
  optional double motion_rate = 1;
  // The number of frames that the scan counted, after it dropped discarded and empty packets and
  // merged field pairs.
  uint32 scanned_frame_count = 2;
  // The media time that the scan covered.
  google.protobuf.Duration scanned_duration = 3;
}

// The inputs of the frame-rate rule for the chosen video stream.
message FrameRateRuleInputs {
  // ffprobe's r_frame_rate. Absent when ffprobe reports none or 0/0.
  Fraction base_rate = 1;
  // ffprobe's avg_frame_rate. Absent when ffprobe reports none or 0/0.
  Fraction average_rate = 2;
  FieldOrder field_order = 3;
  // The stream's time base in seconds.
  Fraction time_base = 4;
  // Absent when the stream carries neither statistics tag.
  MatroskaStatistics matroska_statistics = 5;
  // Absent when the rule took the declared rates without a scan.
  FrameRatePacketScan packet_scan = 6;
}

// The output frame rate that the frame-rate rule chose for the chosen video stream, with its basis
// and inputs. The probe still succeeds when the rule refuses to choose a rate.
message FrameRateRuleResult {
  // Absent only when basis is OUTPUT_FRAME_RATE_BASIS_REFUSED.
  Fraction output_frame_rate = 1;
  OutputFrameRateBasis basis = 2;
  FrameRateRuleInputs inputs = 3;
}

enum KeyframePositionSource {
  KEYFRAME_POSITION_SOURCE_UNSPECIFIED = 0;
  // The worker read the positions from the container index: the MP4 or MOV sync-sample table, or
  // the Matroska Cues element.
  KEYFRAME_POSITION_SOURCE_CONTAINER_INDEX = 1;
  // The worker scanned every packet of the chosen video stream.
  KEYFRAME_POSITION_SOURCE_PACKET_SCAN = 2;
}

// The keyframe positions of the chosen video stream. The positions themselves travel in the
// attempt's ProbeKeyframePositionsPart messages, which arrive before this result.
message KeyframePositions {
  // The ProbeStreamInfo.index of the chosen video stream: its index in the container.
  uint32 stream_index = 1;
  uint32 time_base_numerator = 2;
  uint32 time_base_denominator = 3;
  KeyframePositionSource source = 4;
  // The number of entries in each list across every part of the attempt. The count is at least
  // one; a stream without keyframes reports KEYFRAMES_UNAVAILABLE_REASON_NO_KEYFRAMES instead. When
  // the count differs from the entries the server received, the server fails the probe attempt as
  // a contract violation and retries the probe.
  uint32 keyframe_count = 5;
}

// One run of consecutive keyframe positions from a probe attempt. A long source has too many
// keyframes for one session message, so the worker splits the positions into parts. Each list in a
// part holds at most 4,096 entries. Even when every entry takes the widest sint64 encoding of 10
// bytes, a part then stays below 128 KiB, the largest session message the server accepts. The
// parts of one attempt hold at most 1,048,576 entries in each list, which covers 12 hours of 24 fps
// video in which every frame is a keyframe. The worker may split the entries into parts of any
// size up to the part limit. The server fails the probe attempt when a part or the attempt breaks
// these limits, or when the two lists of a part differ in length.
//
// The worker sends every part of the attempt in decode-time order, before the attempt's
// ProbeAttemptResult. The worker sends parts only when the result reports KeyframePositions. The
// server discards the parts of an attempt whose result reports anything else.
//
// Entry i of both lists in a part describes the same keyframe, so both lists have the same length.
// Entries are ordered by decode time, within a part and across the parts.
// Times count ticks of time_base_numerator / time_base_denominator seconds on the zero-based
// timeline that the producer groups samples on: the demuxer time minus the container start time,
// as FFmpeg's -copyts -start_at_zero produces. The first entry of the attempt's first part is an
// absolute time. Every later entry, including the first entry of a later part, is the difference
// from the entry before it.
message ProbeKeyframePositionsPart {
  Uuid probe_attempt_id = 1;
  repeated sint64 presentation_time_deltas = 2;
  repeated sint64 decode_time_deltas = 3;
}

// Why the server must request a packet scan to learn the keyframe positions.
enum KeyframePacketScanReason {
  KEYFRAME_PACKET_SCAN_REASON_UNSPECIFIED = 0;
  // The container has no index. MPEG-TS, AVI and fragmented MP4 sources are examples.
  KEYFRAME_PACKET_SCAN_REASON_NO_CONTAINER_INDEX = 1;
  // The container index is sparse or incomplete, such as Matroska Cues that skip keyframes.
  KEYFRAME_PACKET_SCAN_REASON_INCOMPLETE_CONTAINER_INDEX = 2;
  // The worker cannot read the last keyframe that the container index lists, as in a truncated
  // file.
  KEYFRAME_PACKET_SCAN_REASON_UNREADABLE_LAST_INDEXED_KEYFRAME = 3;
}

enum KeyframesUnavailableReason {
  KEYFRAMES_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  // A keyframe has no presentation time or no decode time.
  KEYFRAMES_UNAVAILABLE_REASON_KEYFRAME_WITHOUT_TIMESTAMP = 1;
  // A packet scan found no keyframe in the chosen video stream.
  KEYFRAMES_UNAVAILABLE_REASON_NO_KEYFRAMES = 2;
}

// The worker cannot report usable keyframe positions. The server never copies such a source.
message KeyframesUnavailable {
  KeyframesUnavailableReason reason = 1;
}

message ProbeKeyframes {
  oneof result {
    KeyframePositions positions = 1;
    // Only a probe that reads the container index reports this result.
    KeyframePacketScanReason packet_scan_required = 2;
    KeyframesUnavailable unavailable = 3;
  }
}

message ProbeMediaInfo {
  ProbeContainerInfo container = 1;
  repeated ProbeStreamInfo streams = 2;
  // Present only for probe version 3 and later.
  ProbeKeyframes keyframes = 3;
  // The ProbeStreamInfo.index of the chosen video stream: the first video stream that is not an
  // attached picture, such as embedded cover art. Present only for probe version 4 and later. Under
  // those versions, a file whose video streams are all attached pictures reports
  // PROBE_FAILURE_NO_VIDEO_STREAM.
  optional uint32 chosen_video_stream_index = 4;
  // Present only for probe version 4 and later.
  FrameRateRuleResult frame_rate_rule = 5;
  // True when the worker omitted every stream title and every handler name, because the titles and
  // handler names together exceed the limit. The flag covers ProbeStreamInfo.title and
  // ProbeStreamInfo.handler_name, although its name mentions only titles. The titles and handler
  // names of one result take at most 16,384 bytes: the sum of the bytes that each title and each
  // handler name add to its stream's protobuf encoding. A value longer than 512 bytes counts for
  // nothing, because the worker leaves it out first. When the values would take more, the worker
  // reports no title and no handler name on any stream and sets stream_titles_omitted. When no
  // stream has a title or a handler name and stream_titles_omitted is false, the streams have
  // neither.
  //
  // A file controls its titles and handler names, but the result must fit in one session message
  // of at most 128 KiB. A larger probe result fails as PROBE_FAILURE_RESULT_TOO_LARGE. So the
  // 512-byte limit and this limit keep the values from filling the result. Only probe version 4
  // and later set this field.
  bool stream_titles_omitted = 6;
}

message ProbeAttemptResult {
  Uuid probe_attempt_id = 1;
  // Nonzero Streamarr probe result contract version. Must match the request.
  uint32 probe_version = 2;
  oneof outcome {
    // Success requires a video stream; audio-only media reports PROBE_FAILURE_NO_VIDEO_STREAM.
    ProbeMediaInfo media = 3;
    ProbeFailure failure = 4;
  }
}

enum ProbeFailure {
  PROBE_FAILURE_UNSPECIFIED = 0;
  PROBE_FAILURE_INVALID_MEDIA = 1;
  PROBE_FAILURE_NO_VIDEO_STREAM = 2;
  PROBE_FAILURE_SOURCE_UNAVAILABLE = 3;
  PROBE_FAILURE_EXECUTION_FAILED = 4;
  PROBE_FAILURE_UNSUPPORTED_VERSION = 5;
  PROBE_FAILURE_CANCELLED = 6;
  // The result would not fit in one session message: the EstablishWorkerSessionRequest that
  // carries it would take more than 131,072 bytes. The worker checks every result, whatever its
  // stream count or text lengths, and sends this failure in place of the result. The keyframe
  // positions travel in their own parts and do not count toward the result's size. The server
  // stores this failure as the file's probe outcome. It does not retry the probe until the file or
  // the probe version changes. Any probe version may report this failure.
  PROBE_FAILURE_RESULT_TOO_LARGE = 7;
}

message StartProbeCommand {
  WorkerIdentity target = 1;
  ProbeRequest request = 2;
}

message CancelProbeCommand {
  // The worker must still return a terminal ProbeAttemptResult with the original attempt ID and
  // version once execution ends. Capacity remains reserved until that result or session termination.
  WorkerIdentity target = 1;
  Uuid probe_attempt_id = 2;
}

message StopVariantCommand {
  WorkerIdentity target = 1;
  Uuid job_attempt_id = 2;
}

message EstablishWorkerSessionResponse {
  oneof command {
    WorkerSessionAccepted session_accepted = 1;
    StartVariantCommand start_variant = 2;
    StopVariantCommand stop_variant = 3;
    StartProbeCommand start_probe = 4;
    CancelProbeCommand cancel_probe = 5;
  }
}

enum SegmentContentType {
  SEGMENT_CONTENT_TYPE_UNSPECIFIED = 0;
  SEGMENT_CONTENT_TYPE_VIDEO_MP2T = 1;
  SEGMENT_CONTENT_TYPE_VIDEO_MP4 = 2;
}

message SegmentUploadMetadata {
  Uuid worker_session_id = 1;
  // This worker describes itself; the live registry matches it to the authenticated connection.
  WorkerIdentity worker = 2;
  Uuid stream_session_id = 3;
  Uuid job_id = 4;
  Uuid job_attempt_id = 5;
  string variant_label = 6;
  string segment_name = 7;
  SegmentContentType content_type = 8;
  uint64 content_length_bytes = 9;
}

// The first frame carries metadata exactly once. Later frames carry bounded non-empty data chunks.
message UploadSegmentRequest {
  oneof frame {
    SegmentUploadMetadata metadata = 1;
    bytes data = 2;
  }
}

message UploadSegmentResponse {
  Uuid job_attempt_id = 1;
  string segment_name = 2;
  uint64 accepted_length_bytes = 3;
}

service TranscodeWorkerService {
  rpc EstablishWorkerSession(stream EstablishWorkerSessionRequest) returns (stream EstablishWorkerSessionResponse) {}
  rpc UploadSegment(stream UploadSegmentRequest) returns (UploadSegmentResponse) {}
}
