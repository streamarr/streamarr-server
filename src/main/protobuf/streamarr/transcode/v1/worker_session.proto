// Streamarr servers use this contract to dispatch probe and transcode jobs.
// Workers use it to report results and upload media segments. The ADRs in
// streamarr/streamarr-adr define the behavior. These comments state what each
// field means, its units and what an absent value means.

syntax = "proto3";

package streamarr.transcode.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "WorkerSessionProto";
option java_package = "com.streamarr.transcode.v1";

// UUID bits use the same most-significant/least-significant layout as
// java.util.UUID.
message Uuid {
  fixed64 most_significant_bits = 1;
  fixed64 least_significant_bits = 2;
}

message WorkerIdentity {
  Uuid worker_id = 1;
  Uuid boot_id = 2;
}

enum ContainerFormat {
  CONTAINER_FORMAT_UNSPECIFIED = 0;
  CONTAINER_FORMAT_MPEG_TS = 1;
  CONTAINER_FORMAT_FMP4 = 2;
}

enum EncoderKind {
  ENCODER_KIND_UNSPECIFIED = 0;
  ENCODER_KIND_HARDWARE = 1;
  ENCODER_KIND_SOFTWARE = 2;
}

// This message names the encoder that a worker runs for a codec family. Every
// attempt of a variant uses the backend that the variant's first attempt used.
message VideoEncoderBackend {
  VideoCodecFamily codec_family = 1;
  // This field holds the FFmpeg encoder name, such as libx264 or h264_nvenc.
  string encoder = 2;
  EncoderKind kind = 3;
}

// This message names an encoder that passed the worker's test encode.
message WorkerVerifiedVideoEncoder {
  VideoEncoderBackend backend = 1;
  // The worker sets this field to true when ADR 0037 lists the encoder, with
  // the worker's settings, as keyframe-verified. The worker never derives the
  // value from its own output.
  bool keyframe_verified = 2;
  // This field lists each output beyond 8-bit 4:2:0 SDR that passed the
  // worker's own test encode with this encoder. The server sends an encode
  // that needs a feature only to a worker that lists the feature for the
  // encode's codec family. An older worker lists none.
  repeated VideoEncodeFeature encode_features = 3;
}

// This value names an output beyond 8-bit 4:2:0 SDR that a verified encoder
// writes (ADR 0013).
enum VideoEncodeFeature {
  VIDEO_ENCODE_FEATURE_UNSPECIFIED = 0;
  // The encoder writes 10-bit 4:2:0 video, with the profile that
  // VideoDecision.codec_profile names.
  VIDEO_ENCODE_FEATURE_TEN_BIT = 1;
  // The encoder writes 10-bit video with the PQ transfer, BT.2020 primaries
  // and the BT.2020 non-constant luminance matrix, and writes the
  // VideoDecision's mastering_display and content_light_level into the
  // bitstream as HDR10 static metadata.
  VIDEO_ENCODE_FEATURE_PQ = 2;
  // The encoder writes 10-bit video with the HLG transfer, BT.2020 primaries
  // and the BT.2020 non-constant luminance matrix.
  VIDEO_ENCODE_FEATURE_HLG = 3;
  // The worker reshapes Dolby Vision without a compatible base, profiles 5 and
  // 10.0, with each frame's RPU into PQ before this encoder writes the PQ
  // output.
  VIDEO_ENCODE_FEATURE_DOLBY_VISION_TO_PQ = 4;
}

message WorkerCapabilities {
  repeated Uuid source_namespace_ids = 1;
  // This field lists the nonzero probe versions that the worker supports (ADR
  // 0032). Each version reports every fact of the earlier versions. No worker
  // uses version 2. A worker that lists version 7 encodes in the layout that
  // AudioDecision.channel_layout names and downmixes as ADR 0050 decides.
  repeated uint32 probe_versions = 2;
  // The worker lists exactly one encoder for each codec family it can encode.
  repeated WorkerVerifiedVideoEncoder video_encoders = 3;
  // This field lists the stream measurement versions whose bitrate scan chunks
  // the worker runs (ADR 0054). A worker without bitrate scans lists none.
  repeated uint32 measurement_versions = 4;
  // This field lists the bitstream rewrites that the worker applies to a copy
  // (ADR 0036). The server sends a job that lists a rewrite only to a worker
  // that lists it.
  repeated BitstreamRewrite bitstream_rewrites = 5;
  // This field lists the copy features that the worker supports. The server
  // sends a copy that needs a feature only to a worker that lists it.
  repeated VideoCopyFeature video_copy_features = 6;
  // This field lists the software encoder of each codec family that passed the
  // test encode, also where video_encoders lists a hardware backend for the
  // family. A job whose VideoDecision.software_encoder is true runs one of them
  // (ADR 0044, hardware failure).
  repeated WorkerVerifiedVideoEncoder software_video_encoders = 7;
}

// The worker sends this message first on its session. Each capacity counts the
// items of one kind that the connection runs at once. A capacity of 0 accepts
// no item of that kind. ADR 0032 decides how a worker sets each capacity.
message WorkerRegistration {
  WorkerIdentity worker = 1;
  WorkerCapabilities capabilities = 2;
  // This field counts the job attempts that the connection runs at once. The
  // worker never changes it during the session.
  uint32 available_slots = 3;
  // This field counts the background probes that the worker runs at once.
  // ProbeCapacityChanged replaces the value.
  uint32 background_probe_capacity = 4;
  // This field counts the playback probes that the worker reserves capacity
  // for. The worker never changes it during the session.
  uint32 playback_probe_capacity = 5;
  // This field counts the keyframe packet scans and bitrate scan chunks that
  // the worker runs at once. ProbeCapacityChanged replaces the value.
  uint32 keyframe_packet_scan_capacity = 6;
  // The worker always sets ADAPTIVE or FIXED.
  BackgroundProbeCapacityControl background_probe_capacity_control = 7;
}

enum BackgroundProbeCapacityControl {
  BACKGROUND_PROBE_CAPACITY_CONTROL_UNSPECIFIED = 0;
  // The worker adjusts the capacity as its job attempts speed up or slow down.
  BACKGROUND_PROBE_CAPACITY_CONTROL_ADAPTIVE = 1;
  // A worker setting fixes the capacity.
  BACKGROUND_PROBE_CAPACITY_CONTROL_FIXED = 2;
}

enum TranscodeMode {
  TRANSCODE_MODE_UNSPECIFIED = 0;
  TRANSCODE_MODE_REMUX = 1;
  TRANSCODE_MODE_AUDIO_TRANSCODE = 2;
  TRANSCODE_MODE_VIDEO_TRANSCODE = 3;
  TRANSCODE_MODE_FULL_TRANSCODE = 4;
}

enum AudioMode {
  AUDIO_MODE_UNSPECIFIED = 0;
  AUDIO_MODE_COPY = 1;
  AUDIO_MODE_TRANSCODE = 2;
  AUDIO_MODE_NONE = 3;
}

enum SubtitleMode {
  SUBTITLE_MODE_UNSPECIFIED = 0;
  SUBTITLE_MODE_EXCLUDE = 1;
  SUBTITLE_MODE_BURN_IN = 2;
  SUBTITLE_MODE_SIDECAR = 3;
  SUBTITLE_MODE_HLS = 4;
  SUBTITLE_MODE_EMBED = 5;
}

message AudioDecision {
  AudioMode mode = 1;
  optional string codec = 2;
  uint32 channels = 3;
  uint64 bitrate_bits_per_second = 4;
  // This field names the output channel layout of an audio encode, and channels
  // must equal its channel count. UNSPECIFIED means the encode uses channels
  // alone. Only an AUDIO_MODE_TRANSCODE job sets it, and an aac encode names at
  // most 6 channels. The server names a 3-, 4-, 7- or 8-channel layout only for
  // a worker that lists probe version 7 (ADR 0050, ADR 0043).
  AudioChannelLayout channel_layout = 5;
  // When this field is true, the worker adds digital silence after the encoded
  // audio up to TranscodeExecution.advertised_end. The server sets it only on a
  // job that encodes audio and sets advertised_end (ADR 0037, early ends).
  bool pad_with_silence_to_advertised_end = 6;
  // This field holds the chosen audio stream's ProbeStreamInfo.index. A COPY or
  // TRANSCODE job must set it. A NONE job must leave it out.
  optional uint32 stream_index = 7;
  // This field holds the output sample rate in hertz of an encode that names
  // channel_layout. Absent means ADR 0043's rate for the codec applies. The
  // worker resamples only when the rate differs from the source's. A value on
  // any other job, or a 0, fails the attempt with
  // JOB_ATTEMPT_FAILURE_INVALID_SPECIFICATION.
  optional uint32 output_sample_rate_hz = 8;
  // This field holds the output bit depth, 16 or 24, of a FLAC or ALAC encode
  // that names channel_layout. Absent means ADR 0043's depth for the source
  // applies. The worker dithers whenever precision drops. Any other job or
  // value fails with JOB_ATTEMPT_FAILURE_INVALID_SPECIFICATION.
  optional uint32 output_bit_depth = 9;
}

// These values name the channel layouts that the server can name for an audio
// encode. Each value's comment gives the FFmpeg layout name that the worker
// passes to -ch_layout and the layout's channels in FFmpeg's order.
enum AudioChannelLayout {
  // No layout. The encode uses AudioDecision.channels alone.
  AUDIO_CHANNEL_LAYOUT_UNSPECIFIED = 0;
  // mono: FC.
  AUDIO_CHANNEL_LAYOUT_MONO = 1;
  // stereo: FL+FR.
  AUDIO_CHANNEL_LAYOUT_STEREO = 2;
  // 2.1: FL+FR+LFE.
  AUDIO_CHANNEL_LAYOUT_TWO_POINT_ONE = 3;
  // 3.0: FL+FR+FC.
  AUDIO_CHANNEL_LAYOUT_THREE_POINT_ZERO = 4;
  // 3.0(back): FL+FR+BC.
  AUDIO_CHANNEL_LAYOUT_THREE_POINT_ZERO_BACK = 5;
  // 4.0: FL+FR+FC+BC.
  AUDIO_CHANNEL_LAYOUT_FOUR_POINT_ZERO = 6;
  // quad: FL+FR+BL+BR.
  AUDIO_CHANNEL_LAYOUT_QUAD = 7;
  // quad(side): FL+FR+SL+SR.
  AUDIO_CHANNEL_LAYOUT_QUAD_SIDE = 8;
  // 5.1: FL+FR+FC+LFE+BL+BR.
  AUDIO_CHANNEL_LAYOUT_FIVE_POINT_ONE = 9;
  // 5.1(side): FL+FR+FC+LFE+SL+SR.
  AUDIO_CHANNEL_LAYOUT_FIVE_POINT_ONE_SIDE = 10;
  // 7.1: FL+FR+FC+LFE+BL+BR+SL+SR.
  AUDIO_CHANNEL_LAYOUT_SEVEN_POINT_ONE = 11;
  // 5.0: FL+FR+FC+BL+BR.
  AUDIO_CHANNEL_LAYOUT_FIVE_POINT_ZERO = 12;
  // 5.0(side): FL+FR+FC+SL+SR.
  AUDIO_CHANNEL_LAYOUT_FIVE_POINT_ZERO_SIDE = 13;
  // 6.1: FL+FR+FC+LFE+BC+SL+SR.
  AUDIO_CHANNEL_LAYOUT_SIX_POINT_ONE = 14;
  // 6.1(back): FL+FR+FC+LFE+BL+BR+BC.
  AUDIO_CHANNEL_LAYOUT_SIX_POINT_ONE_BACK = 15;
  // 7.1(wide): FL+FR+FC+LFE+BL+BR+FLC+FRC.
  AUDIO_CHANNEL_LAYOUT_SEVEN_POINT_ONE_WIDE = 16;
}

message SubtitleDecision {
  SubtitleMode mode = 1;
  optional string codec = 2;
  optional uint32 stream_index = 3;
  optional string language = 4;
}

enum VideoCodecFamily {
  VIDEO_CODEC_FAMILY_UNSPECIFIED = 0;
  VIDEO_CODEC_FAMILY_H264 = 1;
  VIDEO_CODEC_FAMILY_HEVC = 2;
  VIDEO_CODEC_FAMILY_AV1 = 3;
}

// Each profile belongs to one codec family. An encode forces only H264_HIGH,
// HEVC_MAIN or AV1_MAIN. The probe can report every value.
enum VideoCodecProfile {
  VIDEO_CODEC_PROFILE_UNSPECIFIED = 0;
  VIDEO_CODEC_PROFILE_H264_HIGH = 1;
  VIDEO_CODEC_PROFILE_HEVC_MAIN = 2;
  VIDEO_CODEC_PROFILE_AV1_MAIN = 3;
  // H.264 profile_idc 66 with constraint_set1_flag set.
  VIDEO_CODEC_PROFILE_H264_CONSTRAINED_BASELINE = 4;
  // H.264 profile_idc 66 with constraint_set1_flag clear.
  VIDEO_CODEC_PROFILE_H264_BASELINE = 5;
  // H.264 profile_idc 77.
  VIDEO_CODEC_PROFILE_H264_MAIN = 6;
  // H.264 profile_idc 88.
  VIDEO_CODEC_PROFILE_H264_EXTENDED = 7;
  // H.264 profile_idc 110, including High 10 Intra.
  VIDEO_CODEC_PROFILE_H264_HIGH_10 = 8;
  // H.264 profile_idc 122, including High 4:2:2 Intra.
  VIDEO_CODEC_PROFILE_H264_HIGH_422 = 9;
  // H.264 profile_idc 244, including High 4:4:4 Intra.
  VIDEO_CODEC_PROFILE_H264_HIGH_444_PREDICTIVE = 10;
  // HEVC general_profile_idc 2.
  VIDEO_CODEC_PROFILE_HEVC_MAIN_10 = 11;
  // HEVC general_profile_idc 3.
  VIDEO_CODEC_PROFILE_HEVC_MAIN_STILL_PICTURE = 12;
  // HEVC general_profile_idc 4, which covers every format range extensions
  // profile.
  VIDEO_CODEC_PROFILE_HEVC_FORMAT_RANGE_EXTENSIONS = 13;
  // AV1 seq_profile 1.
  VIDEO_CODEC_PROFILE_AV1_HIGH = 14;
  // AV1 seq_profile 2.
  VIDEO_CODEC_PROFILE_AV1_PROFESSIONAL = 15;
}

// A copy and an H.264 encode carry UNSPECIFIED.
enum VideoCodecTier {
  VIDEO_CODEC_TIER_UNSPECIFIED = 0;
  VIDEO_CODEC_TIER_MAIN = 1;
  VIDEO_CODEC_TIER_HIGH = 2;
}

enum VideoMode {
  VIDEO_MODE_UNSPECIFIED = 0;
  VIDEO_MODE_COPY = 1;
  VIDEO_MODE_ENCODE = 2;
}

// This value names a change that the worker makes to a copied video stream
// without decoding it (ADR 0036). The worker applies exactly the rewrites that
// the job lists, and its produced-output check confirms each one.
enum BitstreamRewrite {
  BITSTREAM_REWRITE_UNSPECIFIED = 0;
  // The worker removes every RPU, every HEVC NAL unit of type 62 or 63, every
  // AV1 metadata OBU that carries an RPU, and the Dolby Vision record.
  BITSTREAM_REWRITE_STRIP_DOLBY_VISION = 1;
  // The worker removes every HDR10+ message and keeps the other SEI messages
  // and metadata OBUs.
  BITSTREAM_REWRITE_STRIP_HDR10_PLUS = 2;
  // The worker writes the Dolby Vision record from dolby_vision_output instead
  // of the source's record. A profile with a compatible base gets metadata
  // compression 0.
  BITSTREAM_REWRITE_NORMALIZE_DOLBY_VISION_RECORD = 3;
  // The worker converts single-track Dolby Vision profile 7 to profile 8.1.
  // streamarr/streamarr-server#651 defines this rewrite.
  BITSTREAM_REWRITE_CONVERT_DOLBY_VISION_PROFILE_7_TO_8_1 = 4;
}

// This value names something a copy can need beyond passing the source's
// video through.
enum VideoCopyFeature {
  VIDEO_COPY_FEATURE_UNSPECIFIED = 0;
  // The worker accepts a copy that sets output_dynamic_range. It writes the
  // static HDR metadata into hvcC and checks the produced output against the
  // planned range and dolby_vision_output.
  VIDEO_COPY_FEATURE_PLANNED_OUTPUT = 1;
  // The worker writes the dvh1 sample entry that dolby_vision_output names,
  // with the parameter sets in the decoder configuration record.
  VIDEO_COPY_FEATURE_DVH1_SAMPLE_ENTRY = 2;
  // The worker renames the av01 sample entry to the dav1 sample entry that
  // dolby_vision_output names.
  VIDEO_COPY_FEATURE_DAV1_SAMPLE_ENTRY = 3;
}

// This value states whether a dynamic-range feature is present (ADR 0036).
// UNSPECIFIED means that the probe could not check.
enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  PRESENCE_ABSENT = 1;
  PRESENCE_PRESENT = 2;
}

// This value names the standard picture format that a player can show without
// advanced HDR information. ADR 0036 derives it from the signaled transfer and
// from Dolby Vision.
enum CompatibleBase {
  // The transfer names none of SDR, PQ or HLG, and VideoDynamicRange holds no
  // Dolby Vision present arm. That includes a stream the probe could not
  // check for Dolby Vision.
  COMPATIBLE_BASE_UNSPECIFIED = 0;
  // The stream has no standard compatible base. It carries Dolby Vision
  // without an SDR, PQ or HLG transfer, or it uses Dolby Vision profile 5 or
  // 10.0.
  COMPATIBLE_BASE_NONE = 1;
  COMPATIBLE_BASE_SDR = 2;
  // The stream uses SMPTE ST 2084, as HDR10 and PQ10 do.
  COMPATIBLE_BASE_PQ = 3;
  // The stream uses ARIB STD-B67.
  COMPATIBLE_BASE_HLG = 4;
}

// This message copies the Dolby Vision configuration record, dvcC or dvvC, as
// the record states it. The numeric fields are optional because zero is a
// valid value.
message DolbyVisionConfiguration {
  // This field holds the Dolby Vision profile, not the codec profile.
  optional uint32 profile = 1;
  // This field holds the Dolby Vision level, not the codec level.
  optional uint32 level = 2;
  optional uint32 base_layer_compatibility_id = 3;
  // This field copies bl_present_flag.
  bool base_layer = 4;
  // This field copies el_present_flag.
  bool enhancement_layer = 5;
  // This field copies rpu_present_flag.
  bool rpu = 6;
}

// The probe found no configuration record, no Dolby Vision sample entry and no
// RPU in the samples. A probe that reads no samples never reports this arm.
message DolbyVisionAbsent {}

// The probe found a configuration record, a Dolby Vision sample entry or an
// RPU.
message DolbyVisionPresent {
  // The probe leaves this field out when it found no record.
  DolbyVisionConfiguration declared = 1;
  // This field states whether the samples contain RPUs. The worker reports
  // UNSPECIFIED when it read no samples.
  Presence observed_rpu = 2;
  // This field holds the header of the stream's first RPU, from probe version
  // 5 on (ADR 0036). The worker leaves it out when observed_rpu is not PRESENT
  // or that first header does not parse. It never uses a later RPU instead.
  DolbyVisionRpuHeader first_rpu_header = 3;
  // The worker reports this field from probe version 5 on.
  DolbyVisionRpuPlacement rpu_placement = 4;
  // From probe version 8, this field classifies the enhancement layer by the
  // NLQ parameters of the RPUs that the probe parsed (ADR 0036). It stays
  // UNSPECIFIED when the worker parsed no RPU.
  DolbyVisionEnhancementLayer enhancement_layer = 5;
  // From probe version 8, this field holds MaxCLL and MaxFALL from the level 6
  // block of the first parsed RPU that carries one. The worker leaves it out
  // when no parsed RPU carries a level 6 block (ADR 0036).
  ContentLightLevel rpu_content_light_level = 6;
}

// This value names the enhancement layer that a stream's RPUs describe.
enum DolbyVisionEnhancementLayer {
  // The worker parsed no RPU, or no parsed RPU states its own NLQ parameters.
  DOLBY_VISION_ENHANCEMENT_LAYER_UNSPECIFIED = 0;
  // Every parsed RPU disables the residual, so no NLQ parameters apply.
  DOLBY_VISION_ENHANCEMENT_LAYER_NONE = 1;
  // Every parsed RPU's NLQ is the identity: a minimal enhancement layer.
  DOLBY_VISION_ENHANCEMENT_LAYER_MEL = 2;
  // A parsed RPU's NLQ is not the identity: a full enhancement layer.
  DOLBY_VISION_ENHANCEMENT_LAYER_FEL = 3;
}

// This value states where RPUs appear in the inspected H.264 or HEVC samples
// (ADR 0036). The value describes only the packets that the worker inspected.
enum DolbyVisionRpuPlacement {
  // The stream is AV1, or the evidence fits neither placement.
  DOLBY_VISION_RPU_PLACEMENT_UNSPECIFIED = 0;
  // Every RPU follows a slice of its own packet and ends that packet.
  DOLBY_VISION_RPU_PLACEMENT_AFTER_OWN_PICTURE = 1;
  // Every packet that holds an RPU starts with it. The worker treats this
  // layout as shifted.
  DOLBY_VISION_RPU_PLACEMENT_STARTS_SAMPLE = 2;
}

// This message states the Dolby Vision that a copy's output carries (ADR
// 0013). The produced Dolby Vision configuration record holds these values.
message DolbyVisionOutput {
  // This field holds the Dolby Vision profile, such as 5, 8 or 10.
  uint32 profile = 1;
  // This field holds the Dolby Vision level, from 1 to 13, that the decision
  // set. It never comes from the RPU's vdr_rpu_level.
  uint32 level = 2;
  // This field holds bl_signal_compatibility_id: 0 for profiles 5 and 10.0, 1
  // for a PQ base, 2 for an SDR base and 4 for an HLG base.
  uint32 base_layer_compatibility_id = 3;
  // The playlist's CODECS attribute follows this sample entry.
  DolbyVisionSampleEntry sample_entry = 4;
}

// This value names the sample entry of a copy that carries Dolby Vision.
enum DolbyVisionSampleEntry {
  DOLBY_VISION_SAMPLE_ENTRY_UNSPECIFIED = 0;
  // The HEVC base entry with a Dolby Vision record, for profiles 8.1 and 8.4.
  DOLBY_VISION_SAMPLE_ENTRY_HVC1 = 1;
  // The Dolby Vision HEVC entry, for profile 5.
  DOLBY_VISION_SAMPLE_ENTRY_DVH1 = 2;
  // The AV1 base entry with a Dolby Vision record, for profiles 10.1 and 10.4.
  DOLBY_VISION_SAMPLE_ENTRY_AV01 = 3;
  // The Dolby Vision AV1 entry, for profile 10.0.
  DOLBY_VISION_SAMPLE_ENTRY_DAV1 = 4;
}

// These RPU header fields identify the Dolby Vision profile when no
// configuration record names it (ADR 0036).
message DolbyVisionRpuHeader {
  uint32 vdr_rpu_profile = 1;
  // This field copies bl_video_full_range_flag.
  bool base_layer_full_range = 2;
  // This field copies el_spatial_resampling_filter_flag.
  bool enhancement_layer_spatial_resampling_filter = 3;
  // This field copies disable_residual_flag.
  bool disable_residual = 4;
  // This field holds vdr_bit_depth_minus8 + 8.
  uint32 vdr_bit_depth = 5;
}

// This message describes one video stream's dynamic range (ADR 0036). A
// planned output never carries an UNSPECIFIED value.
message VideoDynamicRange {
  CompatibleBase compatible_base = 1;
  Presence hdr10_plus = 2;
  // When neither arm is set, the probe could not check for Dolby Vision.
  oneof dolby_vision {
    DolbyVisionAbsent dolby_vision_absent = 3;
    DolbyVisionPresent dolby_vision_present = 4;
  }
}

// This message tells the worker what to do with the chosen video stream. The
// server computes codec_profile, tier, level and codec_string. An encode forces
// them, and a copy carries only codec_string. ADR 0013 and ADR 0036 decide how
// the worker converts the picture and repairs Dolby Vision RPUs.
message VideoDecision {
  VideoMode mode = 6;
  VideoCodecFamily codec_family = 1;
  VideoCodecProfile codec_profile = 2;
  VideoCodecTier tier = 3;
  // This field encodes the level as major x 10 + minor. For example, 41 means
  // level 4.1.
  optional uint32 level = 4;
  // This field holds the RFC 6381 codec string that the variant's playlist
  // advertises. The attempt fails with OUTPUT_MISMATCH when the produced
  // initialization segment carries a different string.
  string codec_string = 5;
  // This field holds the chosen stream's dynamic range as the probe stored it.
  VideoDynamicRange source_dynamic_range = 7;
  // This field holds the planned output's dynamic range. An encode always sets
  // it. A copy sets it when its output is PQ, HLG or has no compatible base, or
  // when it lists a bitstream rewrite. A copy without it passes the source's
  // range through, and an UNSPECIFIED base plays as SDR (ADR 0013).
  VideoDynamicRange output_dynamic_range = 8;
  // This field holds the chosen video's ProbeStreamInfo.index. Every job sets
  // it.
  optional uint32 stream_index = 9;
  // This field holds the chosen stream's codec family on every job. The server
  // sends UNSPECIFIED for any other codec.
  VideoCodecFamily source_codec_family = 10;
  // This field copies the stored
  // ProbeStreamInfo.first_packets_carry_presentation_times. The server sends
  // false when that value is absent.
  bool source_packets_carry_presentation_times = 11;
  // The server sets this field to true only on a copy whose stored
  // ProbeStreamInfo.copy_keeps_packet_bytes is true. The worker then copies the
  // video without the Annex B bitstream filter.
  bool copy_keeps_packet_bytes = 12;
  // The server sets this field only when it encodes an interlaced source. The
  // worker deinterlaces every frame with deinterlace.field_order, whatever each
  // frame's flags say. It deinterlaces before any other filter and writes
  // progressive video. Any encode whose initialization segment declares
  // interlaced video fails with OUTPUT_MISMATCH, with or without this field.
  Deinterlace deinterlace = 13;
  // When this field is true, the worker repeats the last filtered picture at
  // output_frame_rate up to TranscodeExecution.advertised_end. The server sets
  // it only on a job that encodes video and sets advertised_end (ADR 0037,
  // early ends).
  bool hold_last_frame_to_advertised_end = 14;
  // This field lists every bitstream rewrite of a copy once (ADR 0036). An
  // encode lists none. Every job attempt of a variant lists the same rewrites.
  repeated BitstreamRewrite bitstream_rewrites = 15;
  // A copy that the playlist describes as Dolby Vision sets this field, and
  // only with output_dynamic_range (ADR 0013). Without it, a copy that keeps
  // Dolby Vision keeps the source's record.
  DolbyVisionOutput dolby_vision_output = 16;
  // A copy with a PQ output sets each static HDR value that the probe holds,
  // and only with output_dynamic_range. The worker writes each one into an
  // HEVC copy's hvcC as its own SEI message (ADR 0036).
  MasteringDisplayColorVolume mastering_display = 17;
  // An encode with a PQ output sets this field and mastering_display, which
  // the encoder writes as HDR10 static metadata: each value the probe holds,
  // else a P3 D65 display of 1000 and 0.0001 cd/m^2 and a content light level
  // of 0, which means unknown. Other encodes set neither.
  ContentLightLevel content_light_level = 18;
  // When true, the worker encodes with its software encoder of codec_family
  // from WorkerCapabilities.software_video_encoders, even where it lists a
  // hardware backend for the family (ADR 0044, hardware failure).
  bool software_encoder = 19;
  // An encode sets this field to 8 or 10, and the encoder writes that bit
  // depth. An H.264 encode sets 8, and a PQ or HLG encode sets 10. A copy
  // leaves it out. An older server leaves it out of an SDR encode, and the
  // worker then writes 8 bits.
  optional uint32 output_bit_depth = 20;
  // An encode sets this field to CHROMA_SUBSAMPLING_420. A copy leaves it
  // UNSPECIFIED. An older server leaves it UNSPECIFIED on an SDR encode, and
  // the worker then writes 4:2:0. A PQ or HLG encode always sets it.
  ChromaSubsampling output_chroma_subsampling = 21;
}

message Deinterlace {
  // This field holds the field order that the probe stored. It must be TT, BB,
  // TB or BT.
  FieldOrder field_order = 1;
  DeinterlaceOutput output = 2;
}

// This value states how many frames the deinterlacer writes.
// TranscodeExecution.output_frame_rate gives the deinterlacer's output rate.
enum DeinterlaceOutput {
  DEINTERLACE_OUTPUT_UNSPECIFIED = 0;
  // The deinterlacer writes one frame for each field. A 29.97 fps source
  // becomes 59.94 fps.
  DEINTERLACE_OUTPUT_ONE_FRAME_PER_FIELD = 1;
  // The deinterlacer writes one frame for each source frame.
  DEINTERLACE_OUTPUT_ONE_FRAME_PER_FRAME = 2;
}

message TranscodeDecision {
  TranscodeMode mode = 1;
  // This field is retired. Jobs leave it empty and use video.codec_family.
  string video_codec_family = 2;
  AudioDecision audio = 3;
  SubtitleDecision subtitle = 4;
  ContainerFormat container = 5;
  reserved 6;
  reserved "align_keyframes_to_segments";
  VideoDecision video = 7;
}

// relative_key is an opaque key that the installation defines. It is never a
// host path. The worker must not percent-decode or normalize it before the
// namespace mapping resolves it.
message MediaSourceRef {
  Uuid source_namespace_id = 1;
  string relative_key = 2;
}

// Each value names one setting on the preset scale that every software encoder
// shares (ADR 0044).
enum EncoderPreset {
  ENCODER_PRESET_UNSPECIFIED = 0;
  ENCODER_PRESET_ULTRAFAST = 1;
  ENCODER_PRESET_SUPERFAST = 2;
  ENCODER_PRESET_VERYFAST = 3;
  ENCODER_PRESET_FASTER = 4;
  ENCODER_PRESET_FAST = 5;
  ENCODER_PRESET_MEDIUM = 6;
  ENCODER_PRESET_SLOW = 7;
  ENCODER_PRESET_SLOWER = 8;
  ENCODER_PRESET_VERYSLOW = 9;
}

message VariantSpec {
  string variant_label = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint64 bitrate_bits_per_second = 4;
  // The server always sends a preset from the scale. Every attempt of a variant
  // carries the same preset.
  EncoderPreset encoder_preset = 5;
}

message TranscodeExecution {
  uint32 seek_position_seconds = 1;
  uint32 target_segment_duration_seconds = 2;
  // This field is deprecated. Encodes use output_frame_rate.
  double framerate = 3;
  uint32 start_sequence_number = 4;
  // This field counts the media segments that the variant's media playlist
  // advertises. Every attempt of the variant carries the same count. The count
  // must be greater than start_sequence_number.
  uint32 media_segment_count = 5;
  // This field holds where the attempt starts reading, on the zero-based
  // timeline of ProbeKeyframePositionsPart. When it is set, the worker uses it
  // instead of seek_position_seconds. ADR 0037 (early ends) decides when the
  // server sets it.
  google.protobuf.Duration seek_position = 6;
  // This field holds the encode's exact output frame rate. Every encode sets
  // it. A copy leaves it out.
  Fraction output_frame_rate = 7;
  // This field holds the end of the variant's last advertised media segment,
  // on seek_position's timeline. The server sets it on every job that holds the
  // last frame or pads audio. No padded frame starts at or after it (ADR 0037,
  // early ends).
  google.protobuf.Duration advertised_end = 8;
  // Deprecated: segment_start_ticks replaces this list, and a worker that reads
  // segment_start_ticks ignores it. Segment N's start, in slots of
  // target_segment_duration_seconds; empty means segment N starts at slot N.
  // Otherwise it holds media_segment_count strictly increasing entries from 0;
  // when advertised_end is set, the last segment's audio ends there, after the
  // last start (ADR 0037, segment list).
  repeated uint32 segment_start_slots = 9;
  // Segment N's start, in ticks of segment_start_time_base on the zero-based
  // timeline of ProbeKeyframePositionsPart: 0 for segment 0, otherwise the
  // stored presentation tick of the source keyframe that opens segment N.
  // Empty means the plain grid (N x target_segment_duration_seconds). Otherwise
  // media_segment_count strictly increasing entries from 0; when advertised_end
  // is set, the last segment's audio ends there, after the last start (ADR 0037).
  repeated uint64 segment_start_ticks = 10;
  // This field holds the time base of segment_start_ticks: the time base of
  // the stored keyframe positions of the source's chosen video stream. The
  // server sets it exactly when segment_start_ticks is not empty.
  Fraction segment_start_time_base = 11;
}

message VariantJob {
  Uuid stream_session_id = 1;
  // This field identifies one logical variant transcode for the stream
  // session.
  Uuid job_id = 2;
  // The server generates a new value for every dispatch attempt. The value is
  // never a counter.
  Uuid job_attempt_id = 3;
  MediaSourceRef source = 4;
  TranscodeDecision decision = 5;
  VariantSpec variant = 6;
  TranscodeExecution execution = 7;
  // This field holds the source snapshot of the probe outcome that the stream
  // session was built from (ADR 0032). Every job sets it.
  SourceSnapshot source_snapshot = 8;
}

// This message identifies one version of a source file (ADR 0032). Two
// snapshots are equal only when both fields are equal, the modification time
// to the nanosecond.
message SourceSnapshot {
  uint64 size_bytes = 1;
  google.protobuf.Timestamp modified_at = 2;
}

message JobAttemptStarted {
  Uuid job_attempt_id = 1;
  // This field names the attempt's encoder backend. The worker leaves it out
  // when the attempt copies the video.
  VideoEncoderBackend encoder_backend = 2;
}

enum JobAttemptFailure {
  JOB_ATTEMPT_FAILURE_UNSPECIFIED = 0;
  JOB_ATTEMPT_FAILURE_SOURCE_UNAVAILABLE = 1;
  JOB_ATTEMPT_FAILURE_INVALID_SPECIFICATION = 2;
  JOB_ATTEMPT_FAILURE_STARTUP_FAILED = 3;
  JOB_ATTEMPT_FAILURE_TRANSCODE_FAILED = 4;
  // The output differs from the job's video decision. Another attempt on the
  // same backend fails the same way.
  JOB_ATTEMPT_FAILURE_OUTPUT_MISMATCH = 5;
  // A segment would hold more bytes than the segment cap that
  // SegmentUploadMetadata.content_length_bytes states. The worker also reports
  // it when one interval's segments outgrow its budget of two segment caps
  // (ADR 0037, segment list).
  JOB_ATTEMPT_FAILURE_SEGMENT_CAP_EXCEEDED = 6;
  // The attempt read no sample of a chosen stream, and the job does not let
  // the worker fill that stream with a held picture or silence (ADR 0037, early
  // ends).
  JOB_ATTEMPT_FAILURE_STREAM_WITHOUT_SAMPLES = 7;
  // The worker refused a job that copies the video, with or without an audio
  // encode, because its copy cap was full. A worker whose heap holds no copy
  // refuses every copy this way. The worker refuses before FFmpeg starts, and
  // another worker may start the job (ADR 0037, memory).
  JOB_ATTEMPT_FAILURE_COPY_CAP_REACHED = 8;
  // The attempt's hardware encoder backend failed or refused to start, such as
  // at the driver's session limit. The worker reports it only for an attempt
  // on a hardware backend (ADR 0044, hardware failure).
  JOB_ATTEMPT_FAILURE_HARDWARE_ENCODER_FAILED = 9;
  // A copy that converts single-track Dolby Vision profile 7 to profile 8.1
  // met a picture whose RPU it cannot convert: the sample holds no RPU or more
  // than one, or the RPU cannot be read or serves another profile. Another
  // attempt with the same decision meets the same picture, so the server moves
  // to the copy with Dolby Vision stripped (ADR 0036, ADR 0052).
  JOB_ATTEMPT_FAILURE_DOLBY_VISION_CONVERSION_FAILED = 10;
}

message JobAttemptFailed {
  Uuid job_attempt_id = 1;
  JobAttemptFailure failure = 2;
  // The worker sets this field only with STREAM_WITHOUT_SAMPLES, and only while
  // the source still matches VariantJob.source_snapshot (ADR 0037, early ends).
  SourceStreamWithoutSamples stream_without_samples = 3;
}

message JobAttemptCompleted {
  Uuid job_attempt_id = 1;
  // The worker sets this field when the source ran out before the last
  // advertised media segment. The field reports a fact. It is not a failure.
  SourceEndedEarly source_ended_early = 2;
  // The worker lists each chosen stream whose last sample the attempt read. The
  // list stays empty when the source no longer matches
  // VariantJob.source_snapshot (ADR 0037, early ends).
  repeated SourceStreamEnd stream_ends = 3;
  // The worker lists each chosen stream that it filled with silence because the
  // attempt read no sample of it. The snapshot rule of stream_ends applies.
  repeated SourceStreamWithoutSamples streams_without_samples = 4;
}

// This message reports where the source ended, when it ended before the last
// advertised media segment (ADR 0037, early ends).
message SourceEndedEarly {
  // This field numbers the last media segment that holds a source sample. The
  // number is below media_segment_count - 1. The worker always sets it.
  optional uint32 last_segment_with_source_media = 1;
  // This field lists the chosen streams that have samples after that segment's
  // interval. No delivered segment carries those samples. The list stays empty
  // when the attempt holds the last frame.
  repeated uint32 stream_indexes_with_media_after_last_segment = 2;
}

// This message names a chosen stream of which the attempt read no sample from
// read_from on.
message SourceStreamWithoutSamples {
  // This field holds the stream's ProbeStreamInfo.index.
  optional uint32 stream_index = 1;
  // This field holds where the attempt began reading, on seek_position's
  // timeline.
  google.protobuf.Duration read_from = 2;
}

// This message reports where one chosen source stream ended.
message SourceStreamEnd {
  // This field holds the stream's ProbeStreamInfo.index.
  optional uint32 stream_index = 1;
  // This field holds the end of the stream's last sample, on seek_position's
  // timeline. The worker reads it from the source, not from the probe.
  google.protobuf.Duration end_time = 2;
}

message JobAttemptStopped {
  Uuid job_attempt_id = 1;
}

// This message reports how far a running attempt's output has reached. The
// worker sends it at most once a second, and only when a value has grown. The
// worker sends none after the attempt ends (ADR 0037, segment list).
message JobAttemptProgress {
  Uuid job_attempt_id = 1;
  // This field holds the end of the latest video or audio sample that the
  // worker read from FFmpeg's output, on seek_position's timeline, so it keeps
  // growing while FFmpeg writes audio alone after the video's end. The worker
  // leaves it out until it reads the first sample.
  google.protobuf.Duration output_end = 2;
  // When the job holds the last frame, the worker searches the source for the
  // video's last keyframe. This field counts the source bytes that the search
  // has read. It stays 0 when the attempt runs no search.
  uint64 keyframe_search_bytes_read = 3;
}

// The worker sends this message whenever the encoders that it offers change,
// such as when a hardware encoder backend fails and when it passes its check
// again (ADR 0044, hardware failure). The list replaces
// WorkerCapabilities.video_encoders and follows its rules.
message VideoEncodersChanged {
  repeated WorkerVerifiedVideoEncoder video_encoders = 1;
}

// The worker sends this message whenever its background probe capacity or its
// keyframe packet scan capacity changes. The values replace the earlier ones
// (ADR 0032).
message ProbeCapacityChanged {
  uint32 background_probe_capacity = 1;
  uint32 keyframe_packet_scan_capacity = 2;
}

// The worker sends this message on its session. The server accepts at most
// 131,072 encoded bytes (128 KiB) in one message. A larger message ends the
// session.
message EstablishWorkerSessionRequest {
  oneof event {
    WorkerRegistration registration = 1;
    JobAttemptStarted job_attempt_started = 2;
    JobAttemptFailed job_attempt_failed = 3;
    JobAttemptCompleted job_attempt_completed = 4;
    JobAttemptStopped job_attempt_stopped = 5;
    ProbeAttemptResult probe_result = 6;
    ProbeKeyframePositionsPart probe_keyframe_positions_part = 7;
    ProbeCapacityChanged probe_capacity_changed = 8;
    ProbeStreamMeasurementPart probe_stream_measurement_part = 9;
    JobAttemptProgress job_attempt_progress = 10;
    VideoEncodersChanged video_encoders_changed = 11;
  }
}

message WorkerSessionAccepted {
  // This field identifies the live connection. The server refuses uploads
  // from earlier connections.
  Uuid worker_session_id = 1;
  // This field counts the UploadSegment calls that the server accepts from the
  // worker at once. The worker keeps no more calls open at once and queues its
  // other segments (ADR 0037). The server can still refuse a call when its
  // fleet-wide limits are reached. A value of 0 states no limit, and the worker
  // then opens each call without waiting.
  uint32 segment_upload_limit = 2;
}

message StartVariantCommand {
  WorkerIdentity target = 1;
  VariantJob job = 2;
}

message ProbeRequest {
  // The server sends a new, non-nil value for every attempt.
  Uuid probe_attempt_id = 1;
  // This field names the requested probe version. Zero is invalid.
  uint32 probe_version = 2;
  MediaSourceRef source = 3;
  // When this field is true, the worker scans every packet for keyframes
  // instead of reading the container index. Probe version 3 and later accept
  // it.
  bool scan_keyframe_packets = 4;
  // This field states whether a playback request waits for the probe. The
  // worker treats UNSPECIFIED as BACKGROUND.
  ProbePriority priority = 5;
  // When this field is set, the request asks for a bitrate scan chunk instead
  // of a probe. The worker answers with a BitrateScanChunkResult (ADR 0054).
  BitrateScanChunk bitrate_scan_chunk = 6;
}

// This message asks the worker to measure one chunk of a file's keyframe
// intervals (ADR 0054). Packets fall in intervals as StreamMeasurements says.
// An audio packet without a presentation time uses its decode time, for its
// interval and for BitrateScanChunkStream's times. The worker fails the chunk
// with PROBE_FAILURE_INVALID_MEDIA when a measured packet has neither time.
message BitrateScanChunk {
  // This field names the stream measurement version whose rules apply. It is
  // never zero.
  uint32 measurement_version = 1;
  // This field holds the chosen video stream's ProbeStreamInfo.index.
  uint32 chosen_video_stream_index = 2;
  // This field lists the chosen video stream and every audio stream, each
  // once.
  repeated uint32 measured_stream_indexes = 3;
  // These fields hold the time base of the keyframe times. Both are positive.
  uint32 time_base_numerator = 4;
  uint32 time_base_denominator = 5;
  // These lists hold the chunk's keyframes in decode order. They use the delta
  // coding of ProbeKeyframePositionsPart. Both lists hold the same number of
  // entries, from 1 to 4,096.
  repeated sint64 presentation_time_deltas = 6;
  repeated sint64 decode_time_deltas = 7;
  // These fields hold the next chunk's first keyframe, where this chunk ends.
  // The last chunk leaves them out, and its last interval runs to the end of
  // the file.
  optional sint64 end_presentation_time = 8;
  optional sint64 end_decode_time = 9;
  // This field is true for the chunk that holds the file's first keyframe.
  // Packets before that keyframe fall in the chunk's first interval.
  bool first_chunk = 10;
}

enum ProbePriority {
  PROBE_PRIORITY_UNSPECIFIED = 0;
  // A playback request waits for the probe. The probe runs at normal CPU
  // priority.
  PROBE_PRIORITY_PLAYBACK = 1;
  // No request waits for the probe. The probe runs at the lowest CPU priority.
  PROBE_PRIORITY_BACKGROUND = 2;
}

message ProbeContainerInfo {
  optional string format = 1;
  google.protobuf.Duration duration = 2;
  optional int64 bitrate_bits_per_second = 3;
  // This field lists the chapters as ffprobe reports them, from probe version 4
  // on. The chapters take at most 32,768 encoded bytes. Otherwise the list
  // stays empty and chapters_omitted is true.
  repeated ProbeChapter chapters = 4;
  // This field is true when the container has chapters that exceed the limit.
  bool chapters_omitted = 5;
  // From probe version 7, an MP4 or MOV file reports the major brand of its
  // ftyp box as four printable ASCII characters, trailing spaces kept, such as
  // isom or "qt  ". The field is absent without an ftyp box, when the brand
  // holds other bytes, and in other source containers (ADR 0032, ADR 0045).
  optional string major_brand = 6;
}

// This message describes one chapter, on the timeline of
// ProbeKeyframePositionsPart.
message ProbeChapter {
  // The worker leaves this field out when ffprobe reports no start.
  google.protobuf.Duration start_time = 1;
  // The worker leaves this field out when ffprobe reports no end.
  google.protobuf.Duration end_time = 2;
  // This field holds the chapter's title tag, at most 512 bytes of UTF-8. The
  // worker leaves it out when the tag is missing or longer.
  optional string title = 3;
}

// This message holds an exact fraction with a positive numerator and a
// positive denominator, such as 24000/1001.
message Fraction {
  uint32 numerator = 1;
  uint32 denominator = 2;
}

enum ChromaSubsampling {
  // ffprobe reported no pixel format, or one with another layout, such as RGB.
  CHROMA_SUBSAMPLING_UNSPECIFIED = 0;
  CHROMA_SUBSAMPLING_420 = 1;
  CHROMA_SUBSAMPLING_422 = 2;
  CHROMA_SUBSAMPLING_444 = 3;
  // The pixel format has no chroma planes, as gray has none.
  CHROMA_SUBSAMPLING_MONOCHROME = 4;
}

// These values name ITU-T H.273 colour primaries. UNSPECIFIED covers code point
// 2, every code point this enum does not name and a stream without primaries.
enum ColorPrimaries {
  COLOR_PRIMARIES_UNSPECIFIED = 0;
  // Code point 1.
  COLOR_PRIMARIES_BT709 = 1;
  // Code point 4.
  COLOR_PRIMARIES_BT470M = 2;
  // Code point 5.
  COLOR_PRIMARIES_BT470BG = 3;
  // Code point 6.
  COLOR_PRIMARIES_SMPTE170M = 4;
  // Code point 7.
  COLOR_PRIMARIES_SMPTE240M = 5;
  // Code point 8: generic film.
  COLOR_PRIMARIES_FILM = 6;
  // Code point 9: BT.2020 and BT.2100.
  COLOR_PRIMARIES_BT2020 = 7;
  // Code point 10: SMPTE ST 428-1, CIE 1931 XYZ.
  COLOR_PRIMARIES_SMPTE428 = 8;
  // Code point 11: SMPTE RP 431-2, DCI-P3.
  COLOR_PRIMARIES_SMPTE431 = 9;
  // Code point 12: SMPTE EG 432-1, Display P3.
  COLOR_PRIMARIES_SMPTE432 = 10;
  // Code point 22: EBU Tech. 3213-E.
  COLOR_PRIMARIES_EBU3213 = 11;
}

// These values name ITU-T H.273 transfer characteristics. UNSPECIFIED covers
// code point 2, every code point this enum does not name and a stream without
// a transfer.
enum TransferCharacteristics {
  TRANSFER_CHARACTERISTICS_UNSPECIFIED = 0;
  // Code point 1.
  TRANSFER_CHARACTERISTICS_BT709 = 1;
  // Code point 4: an assumed gamma of 2.2.
  TRANSFER_CHARACTERISTICS_BT470M = 2;
  // Code point 5: an assumed gamma of 2.8.
  TRANSFER_CHARACTERISTICS_BT470BG = 3;
  // Code point 6.
  TRANSFER_CHARACTERISTICS_SMPTE170M = 4;
  // Code point 7.
  TRANSFER_CHARACTERISTICS_SMPTE240M = 5;
  // Code point 8.
  TRANSFER_CHARACTERISTICS_LINEAR = 6;
  // Code point 9.
  TRANSFER_CHARACTERISTICS_LOG100 = 7;
  // Code point 10.
  TRANSFER_CHARACTERISTICS_LOG316 = 8;
  // Code point 11: xvYCC.
  TRANSFER_CHARACTERISTICS_IEC61966_2_4 = 9;
  // Code point 12.
  TRANSFER_CHARACTERISTICS_BT1361 = 10;
  // Code point 13: sRGB.
  TRANSFER_CHARACTERISTICS_IEC61966_2_1 = 11;
  // Code point 14.
  TRANSFER_CHARACTERISTICS_BT2020_10 = 12;
  // Code point 15.
  TRANSFER_CHARACTERISTICS_BT2020_12 = 13;
  // Code point 16: SMPTE ST 2084, the perceptual quantizer.
  TRANSFER_CHARACTERISTICS_SMPTE2084 = 14;
  // Code point 17: SMPTE ST 428-1.
  TRANSFER_CHARACTERISTICS_SMPTE428 = 15;
  // Code point 18: ARIB STD-B67, hybrid log-gamma.
  TRANSFER_CHARACTERISTICS_ARIB_STD_B67 = 16;
}

// These values name ITU-T H.273 matrix coefficients. UNSPECIFIED covers code
// point 2, every code point this enum does not name and a stream without a
// matrix.
enum MatrixCoefficients {
  MATRIX_COEFFICIENTS_UNSPECIFIED = 0;
  // Code point 0: the identity matrix, as for RGB and GBR.
  MATRIX_COEFFICIENTS_IDENTITY = 1;
  // Code point 1.
  MATRIX_COEFFICIENTS_BT709 = 2;
  // Code point 4.
  MATRIX_COEFFICIENTS_FCC = 3;
  // Code point 5.
  MATRIX_COEFFICIENTS_BT470BG = 4;
  // Code point 6.
  MATRIX_COEFFICIENTS_SMPTE170M = 5;
  // Code point 7.
  MATRIX_COEFFICIENTS_SMPTE240M = 6;
  // Code point 8.
  MATRIX_COEFFICIENTS_YCGCO = 7;
  // Code point 9: BT.2020 non-constant luminance.
  MATRIX_COEFFICIENTS_BT2020_NCL = 8;
  // Code point 10: BT.2020 constant luminance.
  MATRIX_COEFFICIENTS_BT2020_CL = 9;
  // Code point 11.
  MATRIX_COEFFICIENTS_SMPTE2085 = 10;
  // Code point 12.
  MATRIX_COEFFICIENTS_CHROMA_DERIVED_NCL = 11;
  // Code point 13.
  MATRIX_COEFFICIENTS_CHROMA_DERIVED_CL = 12;
  // Code point 14.
  MATRIX_COEFFICIENTS_ICTCP = 13;
}

// The worker reports UNSPECIFIED when ffprobe reports no range.
enum ColorRange {
  COLOR_RANGE_UNSPECIFIED = 0;
  // The stream uses limited range, which ffprobe calls tv.
  COLOR_RANGE_LIMITED = 1;
  // The stream uses full range, which ffprobe calls pc.
  COLOR_RANGE_FULL = 2;
}

// This message describes one stream of a probed file. Fields 12 to 25 need
// probe version 4. Fields 26 to 36 need version 5. Field 37 needs version 6
// (ADR 0032, ADR 0036).
message ProbeStreamInfo {
  uint32 index = 1;
  string codec_type = 2;
  optional string codec = 3;
  optional string language = 4;
  optional uint32 channels = 5;
  // This field holds ffprobe's bit_rate. From version 6, a Matroska stream
  // without one reports its trusted statistics tags instead. The worker leaves
  // the field out when neither source gives a bitrate.
  optional int64 bitrate_bits_per_second = 6;
  optional uint32 width = 7;
  optional uint32 height = 8;
  optional double framerate = 9;
  bool is_default = 10;
  bool is_forced = 11;
  // The worker reports this field for video streams only. ADR 0036 defines
  // how each probe version reads it.
  VideoDynamicRange dynamic_range = 12;
  // For a video stream, this field counts the bits in a luma sample of the
  // pixel format. It is absent without a pixel format. From probe version 7,
  // an audio stream reports ffprobe's bits_per_raw_sample, or else its
  // bits_per_sample. The field is absent when both are unknown and on subtitle
  // streams. The worker never derives it from the codec (ADR 0032).
  optional uint32 bit_depth = 13;
  // The worker reports this field for video streams only and reads it from the
  // pixel format.
  ChromaSubsampling chroma_subsampling = 14;
  // The worker reports this field for video streams only. It holds how far the
  // display matrix rotates the picture counterclockwise, from -180 to 180
  // degrees. The worker rounds to the nearest whole degree as FFmpeg does, so
  // ffprobe's 89 becomes 90. It leaves the field out without a display matrix.
  optional sint32 rotation_degrees = 15;
  // The worker reports this field for video and audio streams only. It holds
  // the RFC 6381 codec string that a copy of the stream carries. The worker
  // leaves it out when it cannot compute one.
  optional string codec_string = 16;
  // The worker reports this field for video and audio streams only. It holds
  // where the stream ends, from the container header's duration, on the
  // timeline of ProbeKeyframePositionsPart. The worker leaves it out when the
  // header states no duration, and it never estimates one.
  google.protobuf.Duration end_time = 17;
  // The worker reports this field for audio streams only. It holds the sample
  // rate in hertz. The worker leaves it out when ffprobe reports none or 0.
  optional uint32 sample_rate_hz = 18;
  // The worker reports this field for audio streams only. It copies ffprobe's
  // profile text, such as LC or DTS-HD MA. The worker leaves it out when
  // ffprobe reports no profile.
  optional string audio_profile = 19;
  // The worker reports this field for video streams only. It holds the crop
  // that the container requests. The worker leaves it out when there is none.
  ContainerCropping container_cropping = 20;
  // The worker reports this field for video streams only. It leaves the field
  // out when no source supplies complete values in range (ADR 0036).
  MasteringDisplayColorVolume mastering_display = 21;
  // The worker reports this field for video streams only. It leaves the field
  // out when no source supplies complete values in range (ADR 0036).
  ContentLightLevel content_light_level = 22;
  // The worker reports this field for audio and subtitle streams only. It holds
  // the title or name tag, at most 512 bytes of UTF-8. The worker leaves it out
  // when neither tag gives a title or the value is longer.
  optional string title = 23;
  // The worker reports this field for audio and subtitle streams only. It
  // copies the handler_name tag, at most 512 bytes of UTF-8. The worker leaves
  // it out when the tag is missing or longer.
  optional string handler_name = 24;
  // The worker reports this field for audio and subtitle streams only. It
  // copies ffprobe's hearing_impaired disposition. False never proves that a
  // track lacks sound descriptions.
  optional bool is_hearing_impaired = 25;
  // The worker reports this field for video streams only. It reads the profile
  // from the decoder configuration record or the sequence header. Other codecs
  // and unlisted profiles report UNSPECIFIED.
  VideoCodecProfile codec_profile = 26;
  // The worker reports this field for video streams only, as major x 10 +
  // minor. It leaves the field out when codec_profile is UNSPECIFIED, for H.264
  // level 1b and for AV1 seq_level_idx 31.
  optional uint32 codec_level = 27;
  // The worker reports this field for video streams only. H.264 reports
  // UNSPECIFIED, as does a stream whose codec_profile is UNSPECIFIED.
  VideoCodecTier codec_tier = 28;
  // The worker reports these color fields for video streams only. It reads
  // ffprobe's color_primaries, color_transfer, color_space and color_range.
  ColorPrimaries color_primaries = 29;
  TransferCharacteristics transfer_characteristics = 30;
  MatrixCoefficients matrix_coefficients = 31;
  ColorRange color_range = 32;
  // This field is true when the worker decoded 1 to 3 first frames of the
  // chosen video stream. A read of fewer than 3 frames counts as cut short. The
  // worker discards a read when ffprobe fails, writes no JSON or writes more
  // than 4 MiB. A discarded read gives no evidence (ADR 0036).
  bool first_frames_read = 33;
  // The worker sets this field when a video stream may hold mastering display
  // metadata that mastering_display leaves out. Such a stream is never PQ10.
  bool mastering_display_omitted = 34;
  // The worker sets this field when a video stream may hold a content light
  // level that content_light_level leaves out. Such a stream is never PQ10.
  bool content_light_level_omitted = 35;
  // The worker reports this field for the chosen H.264, HEVC or AV1 stream
  // only. It states whether every inspected packet has a presentation time. The
  // worker leaves it out when it read no packets.
  optional bool first_packets_carry_presentation_times = 36;
  // The worker reports this field for H.264 and HEVC video streams only. It is
  // true when a copy without the Annex B bitstream filter delivers every packet
  // with its bytes unchanged under the same codec string. The server reads an
  // absent value as false.
  optional bool copy_keeps_packet_bytes = 37;
  // From probe version 7, an audio stream reports ffprobe's channel_layout
  // unchanged, such as stereo, 5.1(side) or 3 channels (FL+FR+TFL). The field
  // is absent when ffprobe reports none, and the server then treats the layout
  // as unknown. The worker never reports the word unknown (ADR 0032).
  optional string channel_layout = 38;
  // From probe version 7, an audio stream reports ffprobe's sample_fmt
  // unchanged, such as s16, s32p or fltp. It names how the decoder stores each
  // sample, not how many bits carry audio. The field is absent when ffprobe
  // reports none. The worker never reports the word unknown.
  optional string sample_format = 39;
  // From probe version 7, fields 40 to 46 copy seven of ffprobe's final
  // dispositions. Every audio stream reports all seven, and every subtitle
  // stream reports is_comment. Each is true when ffprobe prints 1. Each is
  // absent elsewhere, and the server reads an absent value as false (ADR 0032).
  //
  // The stream is a commentary track.
  optional bool is_comment = 40;
  // The stream serves viewers who are blind or have low vision.
  optional bool is_visual_impaired = 41;
  // The stream describes the picture.
  optional bool is_descriptions = 42;
  // The stream is in the content's original language.
  optional bool is_original = 43;
  // The stream is dubbed.
  optional bool is_dub = 44;
  // The stream holds music and effects without dialogue.
  optional bool is_clean_effects = 45;
  // A receiver mixes the stream with the main track and never plays it alone.
  optional bool is_dependent = 46;
  // From probe version 7, a FLAC stream reports the minimum block size in
  // samples from its STREAMINFO block (RFC 9639 section 8.2), as written. The
  // field is absent unless the stream's extradata is exactly 34 bytes, and on
  // every other stream (ADR 0032).
  optional uint32 flac_minimum_block_size_samples = 47;
  // From probe version 7, a video stream of an MP4 or MOV file reports the
  // four printable ASCII characters that name its sample entry, such as avc1,
  // hev1 or dvh1. codec_string names a copy's sample entry instead. The field
  // is absent in other source containers, which store no sample entry, for a
  // stream without one, such as cover art, and on other streams (ADR 0032).
  optional string sample_entry = 48;
  // From probe version 8, the chosen video stream reports, in frames per
  // second, the highest rate its presentation times show over 1 to 24
  // consecutive frame intervals, a listed rate when one fits their precision,
  // or the base rate its declared rates agree on when no time proves a faster
  // one. It is absent when the worker cannot measure it, on an interlaced
  // stream and on every other stream. It is never zero (ADR 0032).
  Fraction maximum_frame_rate = 49;
}

// These fields count the pixels that the container crop removes from each
// edge. width and height keep the size before cropping.
message ContainerCropping {
  uint32 top = 1;
  uint32 bottom = 2;
  uint32 left = 3;
  uint32 right = 4;
}

// This message holds SMPTE ST 2086 mastering display color volume in HEVC SEI
// units (ADR 0036).
message MasteringDisplayColorVolume {
  ChromaticityCoordinates red = 1;
  ChromaticityCoordinates green = 2;
  ChromaticityCoordinates blue = 3;
  ChromaticityCoordinates white_point = 4;
  // This field uses units of 0.0001 cd/m^2. For example, 10000000 means 1000
  // cd/m^2.
  uint32 max_luminance = 5;
  // This field uses units of 0.0001 cd/m^2. For example, 50 means 0.005
  // cd/m^2.
  uint32 min_luminance = 6;
}

// This message holds a CIE 1931 chromaticity in units of 0.00002. Each value
// lies from 0 to 50000. For example, x 15635 and y 16450 is the D65 white
// point.
message ChromaticityCoordinates {
  uint32 x = 1;
  uint32 y = 2;
}

// This message holds a CTA-861.3 content light level in cd/m^2. Each value
// lies from 0 to 65535. A zero means that mastering did not compute the value
// (ADR 0036).
message ContentLightLevel {
  // This field holds MaxCLL.
  uint32 max_content_light_level = 1;
  // This field holds MaxFALL.
  uint32 max_frame_average_light_level = 2;
}

// This value states the order of an interlaced frame's fields, as ffprobe's
// field_order reports it.
enum FieldOrder {
  // ffprobe reported an unknown field order or none.
  FIELD_ORDER_UNSPECIFIED = 0;
  FIELD_ORDER_PROGRESSIVE = 1;
  // The top field is coded first and displayed first.
  FIELD_ORDER_TT = 2;
  // The bottom field is coded first and displayed first.
  FIELD_ORDER_BB = 3;
  // The top field is coded first. The bottom field is displayed first.
  FIELD_ORDER_TB = 4;
  // The bottom field is coded first. The top field is displayed first.
  FIELD_ORDER_BT = 5;
}

// This value states how the worker chose the output frame rate (ADR 0037).
enum OutputFrameRateBasis {
  OUTPUT_FRAME_RATE_BASIS_UNSPECIFIED = 0;
  // The declared rates agree on a listed rate. Matroska statistics, when
  // present, agree too.
  OUTPUT_FRAME_RATE_BASIS_DECLARED_RATES = 1;
  // The worker scanned the packets. Matroska statistics show that the whole
  // stream runs faster than its first 30 seconds, so the worker kept the
  // declared rate.
  OUTPUT_FRAME_RATE_BASIS_MATROSKA_STATISTICS = 2;
  // The worker matched a listed rate to the motion rate that it scanned.
  OUTPUT_FRAME_RATE_BASIS_PACKET_SCAN = 3;
  // The scan found fewer than 2 frames. The worker matched a listed rate to a
  // declared rate.
  OUTPUT_FRAME_RATE_BASIS_DECLARED_RATE_FALLBACK = 4;
  // The rule could not choose a rate.
  OUTPUT_FRAME_RATE_BASIS_REFUSED = 5;
}

// These fields copy Matroska's NUMBER_OF_FRAMES and DURATION statistics tags,
// with any language suffix.
message MatroskaStatistics {
  optional uint64 number_of_frames = 1;
  google.protobuf.Duration duration = 2;
}

// These fields report what the packet scan measured over the chosen stream's
// first 30 seconds.
message FrameRatePacketScan {
  // This field holds how many frames per second the motion actually runs. The
  // worker leaves it out when the scan found fewer than 2 frames.
  optional double motion_rate = 1;
  // This field counts the frames that the scan found. The worker first removes
  // discarded and empty packets and merges field pairs.
  uint32 scanned_frame_count = 2;
  google.protobuf.Duration scanned_duration = 3;
}

// These fields hold the inputs that the output frame rate rule used.
message FrameRateRuleInputs {
  // This field copies ffprobe's r_frame_rate. The worker leaves it out when
  // ffprobe reports none or 0/0.
  Fraction base_rate = 1;
  // This field copies ffprobe's avg_frame_rate. The worker leaves it out when
  // ffprobe reports none or 0/0.
  Fraction average_rate = 2;
  FieldOrder field_order = 3;
  // This field holds the stream's time base in seconds.
  Fraction time_base = 4;
  // The worker leaves this field out when the stream has neither statistics
  // tag.
  MatroskaStatistics matroska_statistics = 5;
  // The worker leaves this field out when the declared rates decided the rate
  // without a scan.
  FrameRatePacketScan packet_scan = 6;
}

// This message reports the output frame rate that the worker chose, the basis
// for the choice and the inputs. The probe still succeeds when the rule
// refuses to choose.
message FrameRateRuleResult {
  // The worker leaves this field out only when basis is REFUSED.
  Fraction output_frame_rate = 1;
  OutputFrameRateBasis basis = 2;
  FrameRateRuleInputs inputs = 3;
}

enum KeyframePositionSource {
  KEYFRAME_POSITION_SOURCE_UNSPECIFIED = 0;
  // The worker read the MP4 or MOV sync-sample table, or the Matroska Cues.
  KEYFRAME_POSITION_SOURCE_CONTAINER_INDEX = 1;
  // The worker scanned every packet of the chosen video stream.
  KEYFRAME_POSITION_SOURCE_PACKET_SCAN = 2;
}

// This message describes the chosen video stream's keyframe positions. The
// positions travel in the attempt's ProbeKeyframePositionsPart messages, which
// arrive before this result.
message KeyframePositions {
  // This field holds the chosen video stream's ProbeStreamInfo.index.
  uint32 stream_index = 1;
  uint32 time_base_numerator = 2;
  uint32 time_base_denominator = 3;
  KeyframePositionSource source = 4;
  // This field counts the entries in each list across all parts. It is at
  // least 1. The server fails the probe attempt when the parts hold a
  // different number.
  uint32 keyframe_count = 5;
}

// This message carries consecutive keyframe positions of one probe attempt in
// decode order, before the result. Each list holds at most 4,096 entries in a
// part and 1,048,576 in an attempt. Both lists have the same length. Times
// count time-base ticks from the container start. The attempt's first entry
// is absolute. Each later entry is the difference from the entry before it.
message ProbeKeyframePositionsPart {
  Uuid probe_attempt_id = 1;
  repeated sint64 presentation_time_deltas = 2;
  repeated sint64 decode_time_deltas = 3;
}

// This value explains why the server must request a packet scan to learn the
// keyframe positions.
enum KeyframePacketScanReason {
  KEYFRAME_PACKET_SCAN_REASON_UNSPECIFIED = 0;
  // The container has no index, as in MPEG-TS, AVI and fragmented MP4.
  KEYFRAME_PACKET_SCAN_REASON_NO_CONTAINER_INDEX = 1;
  // The index skips keyframes, as sparse Matroska Cues do.
  KEYFRAME_PACKET_SCAN_REASON_INCOMPLETE_CONTAINER_INDEX = 2;
  // The worker cannot read the last indexed keyframe, as in a truncated file.
  KEYFRAME_PACKET_SCAN_REASON_UNREADABLE_LAST_INDEXED_KEYFRAME = 3;
}

enum KeyframesUnavailableReason {
  KEYFRAMES_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  // A keyframe has no presentation time or no decode time.
  KEYFRAMES_UNAVAILABLE_REASON_KEYFRAME_WITHOUT_TIMESTAMP = 1;
  // A packet scan found no keyframe.
  KEYFRAMES_UNAVAILABLE_REASON_NO_KEYFRAMES = 2;
}

// The worker cannot report usable keyframe positions. The server never copies
// such a source.
message KeyframesUnavailable {
  KeyframesUnavailableReason reason = 1;
}

message ProbeKeyframes {
  oneof result {
    KeyframePositions positions = 1;
    // Only a probe that reads the container index reports this result.
    KeyframePacketScanReason packet_scan_required = 2;
    KeyframesUnavailable unavailable = 3;
  }
}

// This value names the step that measured a file's streams (ADR 0054).
enum StreamMeasurementSource {
  STREAM_MEASUREMENT_SOURCE_UNSPECIFIED = 0;
  // The probe read the sample tables of an MP4 or MOV file that is not
  // fragmented.
  STREAM_MEASUREMENT_SOURCE_SAMPLE_TABLE = 1;
  // A keyframe packet scan listed every packet.
  STREAM_MEASUREMENT_SOURCE_KEYFRAME_PACKET_SCAN = 2;
  // A bitrate scan listed every packet.
  STREAM_MEASUREMENT_SOURCE_BITRATE_SCAN = 3;
}

// This message reports one video or audio stream's exact size (ADR 0054). The
// sizes count the payload bytes that a stream copy delivers, without container
// framing. The values for each keyframe interval travel in
// ProbeStreamMeasurementPart messages before the result.
message MeasuredStream {
  // This field holds a video or audio stream's ProbeStreamInfo.index.
  uint32 stream_index = 1;
  // This field adds up the stream's packet bytes. It is at most 2^63 - 1.
  uint64 measured_bytes = 2;
  // This field counts the stream's packets. It is at most 2^63 - 1.
  uint64 packet_count = 3;
  // These fields hold the stream's time base. Both are positive.
  uint32 time_base_numerator = 4;
  uint32 time_base_denominator = 5;
  // This field counts the ticks from the first presentation time to the end of
  // the last packet. It is at most 2^63 - 1.
  uint64 measured_duration = 6;
}

// This message reports the sizes of a file's video and audio streams beside
// KeyframePositions (ADR 0054). Each stream has keyframe_count intervals. A
// chosen video packet falls in the interval of its decode order, and an audio
// packet in the interval of its presentation time. Packets before the first
// keyframe fall in the first interval. The last interval runs to the end of
// the file. The worker leaves the message out when it cannot measure a stream.
message StreamMeasurements {
  StreamMeasurementSource source = 1;
  // This field lists the chosen video stream and every audio stream, each
  // once. It may also list another video stream, whose packets fall in the
  // interval of their decode time.
  repeated MeasuredStream streams = 2;
}

// This message carries one stream's bytes and packets in consecutive keyframe
// intervals, in interval order, before the result. A part holds 1 to 4,096
// entries. An attempt holds at most 8,388,608 entries across at most 1,024
// streams.
message ProbeStreamMeasurementPart {
  Uuid probe_attempt_id = 1;
  // This field holds the stream's MeasuredStream.stream_index.
  uint32 stream_index = 2;
  // Entry i holds the stream's bytes in the next keyframe interval.
  repeated uint32 keyframe_interval_bytes = 3;
  // Entry i counts the stream's packets in the same interval. The list has as
  // many entries as keyframe_interval_bytes.
  repeated uint32 keyframe_interval_packet_counts = 4;
}

message ProbeMediaInfo {
  ProbeContainerInfo container = 1;
  repeated ProbeStreamInfo streams = 2;
  // The worker reports this field from probe version 3 on.
  ProbeKeyframes keyframes = 3;
  // This field holds the first video stream that is not an attached picture.
  // The worker reports it from probe version 4 on. When every video stream is
  // an attached picture, the probe fails with PROBE_FAILURE_NO_VIDEO_STREAM.
  optional uint32 chosen_video_stream_index = 4;
  // The worker reports this field from probe version 4 on.
  FrameRateRuleResult frame_rate_rule = 5;
  // This field is true when the worker left out every title and handler name
  // because together they exceed 16,384 encoded bytes. Probe version 4 and
  // later set it.
  bool stream_titles_omitted = 6;
  // The worker leaves this field out when it measured no stream (ADR 0054).
  StreamMeasurements stream_measurements = 7;
}

message ProbeAttemptResult {
  Uuid probe_attempt_id = 1;
  // This field names the probe version. It must match the request.
  uint32 probe_version = 2;
  oneof outcome {
    // A probe succeeds only when the file has a video stream.
    ProbeMediaInfo media = 3;
    ProbeFailure failure = 4;
    // The worker answers a request that carries a BitrateScanChunk with this
    // result or a failure.
    BitrateScanChunkResult bitrate_scan_chunk = 5;
  }
}

// This message reports what the worker found in one bitrate scan chunk.
message BitrateScanChunkResult {
  oneof result {
    // The worker measured every requested stream. Each stream has one
    // ProbeStreamMeasurementPart entry for each keyframe in the chunk.
    BitrateScanChunkStreams measured = 1;
    // A stream copy would change a measured stream's packets (ADR 0054). The
    // worker sends no ProbeStreamMeasurementPart for the attempt.
    BitrateScanCopyChangesPackets copy_changes_packets = 2;
  }
}

// This message lists one entry for each stream in
// BitrateScanChunk.measured_stream_indexes.
message BitrateScanChunkStreams {
  repeated BitrateScanChunkStream streams = 1;
}

// This message reports one stream's packets in one bitrate scan chunk.
message BitrateScanChunkStream {
  // This field holds the stream's ProbeStreamInfo.index.
  uint32 stream_index = 1;
  // This field adds up the stream's packet bytes in the chunk. It is at most
  // 2^63 - 1.
  uint64 measured_bytes = 2;
  // This field counts the stream's packets in the chunk. It is at most
  // 2^63 - 1.
  uint64 packet_count = 3;
  // These fields hold the stream's time base. Both are positive.
  uint32 time_base_numerator = 4;
  uint32 time_base_denominator = 5;
  // This field holds the earliest presentation time of the stream's packets.
  // It counts ticks of the stream's time base on the zero-based timeline of
  // the chunk's keyframes. The worker sets it and end_time exactly when the
  // chunk holds a packet of the stream. An audio time lies within the chunk's
  // keyframe bounds. The first chunk has no lower bound and the last chunk has
  // no upper bound.
  optional sint64 first_presentation_time = 6;
  // This field holds the end of the stream's last packet in the chunk, in the
  // same ticks. It is at least first_presentation_time.
  optional sint64 end_time = 7;
}

// This message names the first measured stream whose packets a stream copy
// would change.
message BitrateScanCopyChangesPackets {
  // This field holds one of BitrateScanChunk.measured_stream_indexes.
  uint32 stream_index = 1;
}

enum ProbeFailure {
  PROBE_FAILURE_UNSPECIFIED = 0;
  PROBE_FAILURE_INVALID_MEDIA = 1;
  PROBE_FAILURE_NO_VIDEO_STREAM = 2;
  PROBE_FAILURE_SOURCE_UNAVAILABLE = 3;
  PROBE_FAILURE_EXECUTION_FAILED = 4;
  PROBE_FAILURE_UNSUPPORTED_VERSION = 5;
  PROBE_FAILURE_CANCELLED = 6;
  // The result would exceed the session message limit. The server stores this
  // outcome until the file or the probe version changes.
  PROBE_FAILURE_RESULT_TOO_LARGE = 7;
  // Every unit of the capacity was busy, so ffprobe never started. The server
  // keeps the probe queued.
  PROBE_FAILURE_NO_FREE_CAPACITY = 8;
}

message StartProbeCommand {
  WorkerIdentity target = 1;
  ProbeRequest request = 2;
}

// After the probe ends, the worker still returns a terminal ProbeAttemptResult
// for the attempt.
message CancelProbeCommand {
  WorkerIdentity target = 1;
  Uuid probe_attempt_id = 2;
  // A current server never sends UNSPECIFIED.
  ProbeCancelReason reason = 3;
}

// This value explains why the server ended a probe. Only the server enforces
// probe timeouts.
enum ProbeCancelReason {
  // The worker reads this value as OTHER.
  PROBE_CANCEL_REASON_UNSPECIFIED = 0;
  // The probe, scan or chunk reached its timeout on the server.
  PROBE_CANCEL_REASON_TIMEOUT = 1;
  PROBE_CANCEL_REASON_SERVER_SHUTDOWN = 2;
  PROBE_CANCEL_REASON_OTHER = 3;
}

message StopVariantCommand {
  WorkerIdentity target = 1;
  Uuid job_attempt_id = 2;
}

// The server sends this command to the worker that runs a seek's new job
// attempt while the seek's first media segment is pending. The worker pauses
// each listed job attempt, so that the seek's encode gets the CPU, and resumes
// it when a later command leaves it out (ADR 0044, seek priority). Each command
// replaces the list of the previous one, and an empty list resumes every paused
// job attempt. A worker that predates this command ignores it.
message YieldToSeekCommand {
  WorkerIdentity target = 1;
  // This field lists the job attempts to pause. The worker ignores a job
  // attempt that it does not run. A job attempt that resumed keeps running,
  // even when listed, until it has run for as long as it was paused and has
  // delivered a media segment whose delivery began after the resume.
  repeated Uuid job_attempt_ids = 2;
  // This field holds the longest time that the worker keeps a listed job
  // attempt paused, counted from the command that paused it. The worker then
  // resumes the job attempt even when no later command arrives. A later command
  // that lists a job attempt that is still paused keeps its first deadline. An
  // absent or zero value pauses nothing.
  google.protobuf.Duration hold_limit = 3;
}

message EstablishWorkerSessionResponse {
  oneof command {
    WorkerSessionAccepted session_accepted = 1;
    StartVariantCommand start_variant = 2;
    StopVariantCommand stop_variant = 3;
    StartProbeCommand start_probe = 4;
    CancelProbeCommand cancel_probe = 5;
    YieldToSeekCommand yield_to_seek = 6;
  }
}

enum SegmentContentType {
  SEGMENT_CONTENT_TYPE_UNSPECIFIED = 0;
  SEGMENT_CONTENT_TYPE_VIDEO_MP2T = 1;
  SEGMENT_CONTENT_TYPE_VIDEO_MP4 = 2;
}

message SegmentUploadMetadata {
  Uuid worker_session_id = 1;
  WorkerIdentity worker = 2;
  Uuid stream_session_id = 3;
  Uuid job_id = 4;
  Uuid job_attempt_id = 5;
  string variant_label = 6;
  string segment_name = 7;
  SegmentContentType content_type = 8;
  // This field holds the segment's length in bytes. The length lies from 1 to
  // the segment cap of 134,217,728 bytes (128 MiB).
  uint64 content_length_bytes = 9;
  // This field holds the media segment's duration. An initialization segment
  // leaves it out.
  google.protobuf.Duration media_duration = 10;
  // This field holds the wall-clock time that the worker took to produce the
  // media segment, without the time it waited for earlier uploads. An
  // initialization segment leaves it out (ADR 0032, ADR 0044).
  google.protobuf.Duration production_time = 11;
}

// The first request carries the metadata. Each later request carries a
// non-empty chunk of data.
message UploadSegmentRequest {
  oneof frame {
    SegmentUploadMetadata metadata = 1;
    bytes data = 2;
  }
}

message UploadSegmentResponse {
  Uuid job_attempt_id = 1;
  string segment_name = 2;
  uint64 accepted_length_bytes = 3;
}

// The server attaches this message, packed in a google.rpc.Status detail, when
// it refuses an UploadSegment call with RESOURCE_EXHAUSTED because the worker
// already holds segment_upload_limit calls. A refusal without it comes from the
// server's fleet-wide limits. On this refusal the worker queues the segment
// again; on any other refusal it fails the job attempt (ADR 0037).
message SegmentUploadLimitReached {}

service TranscodeWorkerService {
  rpc EstablishWorkerSession(stream EstablishWorkerSessionRequest) returns (stream EstablishWorkerSessionResponse) {}
  rpc UploadSegment(stream UploadSegmentRequest) returns (UploadSegmentResponse) {}
}
